<!doctype html>

<html lang="en">
  <head>
    <title>Ophis: intent-based DEX aggregator, MEV-protected swaps</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Ophis is an intent-based DEX aggregator. Choose your tokens and amount, review the quote, and sign a MEV-protected swap."
    />

    <!-- Self-referential canonical for the swap host. The SPA still sets
         per-route canonical at runtime; this is the crawler-visible default
         so swap.ophis.fi is not deduped against the landing host. -->
    <link rel="canonical" href="https://swap.ophis.fi/" />

    <script src="/emergency.js"></script>

    <!-- Manifest, theme & colors  -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/ophis-icon.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="/ophis-icon-inverse.svg" media="(prefers-color-scheme: dark)" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="mask-icon" href="/ophis-icon.svg" color="#F2A63E" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Social media tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ophis, the intent-based DEX aggregator" />
    <meta
      property="og:description"
      content="Choose your tokens and amount, review the quote, and sign a MEV-protected swap."
    />
    <meta property="og:image" content="https://swap.ophis.fi/ophis-og.jpg" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:image:alt" content="Ophis cosmic gradient hero" />
    <meta property="og:url" content="https://swap.ophis.fi/" />
    <meta property="og:site_name" content="Ophis" />

    <!-- Twitter media tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ophis, the intent-based DEX aggregator" />
    <meta name="twitter:description" content="Choose your tokens and amount, review the quote, and sign a MEV-protected swap." />
    <meta name="twitter:image" content="https://swap.ophis.fi/ophis-og.jpg" />
    <meta name="twitter:image:alt" content="Ophis cosmic gradient hero" />

    <!-- Reuse the landing's organization and software identities across hosts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://ophis.fi/#organization",
            "name": "Ophis",
            "url": "https://ophis.fi/",
            "logo": "https://ophis.fi/ophis-claw-saffron.svg",
            "sameAs": ["https://github.com/ophis-fi/ophis", "https://x.com/ophisfi", "https://t.me/ophisfi"]
          },
          {
            "@type": "WebApplication",
            "@id": "https://ophis.fi/#software",
            "name": "Ophis",
            "url": "https://swap.ophis.fi/",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "Web",
            "description": "Intent-based DEX aggregator across 13 EVM chains, including Robinhood Chain. Choose your tokens and amount, review the quote, and sign with your own wallet. A competitive solver network fills the swap with MEV protection. The app also swaps SOL and SPL tokens natively on Solana with a Solana wallet.",
            "publisher": { "@id": "https://ophis.fi/#organization" }
          },
          {
            "@type": "WebSite",
            "@id": "https://swap.ophis.fi/#website",
            "name": "Ophis Swap",
            "url": "https://swap.ophis.fi/",
            "publisher": { "@id": "https://ophis.fi/#organization" },
            "inLanguage": "en"
          },
          {
            "@type": "WebPage",
            "@id": "https://swap.ophis.fi/#webpage",
            "name": "Ophis: intent-based DEX aggregator, MEV-protected swaps",
            "url": "https://swap.ophis.fi/",
            "isPartOf": { "@id": "https://swap.ophis.fi/#website" },
            "mainEntity": { "@id": "https://ophis.fi/#software" },
            "publisher": { "@id": "https://ophis.fi/#organization" },
            "inLanguage": "en"
          }
        ]
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
        color: #17191c;
      }

      #swap-loading{box-sizing:border-box;min-height:100vh;display:grid;align-content:center;justify-items:center;padding:24px}
      #swap-loading img{margin-bottom:28px}
      #swap-loading .skl{box-sizing:border-box;width:min(392px,100%);margin:0 auto;background:#ffffff;border:1px solid #e8e8ea;border-radius:20px;padding:16px;box-shadow:0 8px 40px rgba(23,25,28,.06)}
      #swap-loading .skl .row{display:flex;align-items:center;justify-content:space-between;background:#f2f2f3;border-radius:14px;padding:16px 18px}
      #swap-loading .skl .arw{width:34px;height:34px;margin:8px auto;border-radius:50%;background:#f2f2f3;border:1px solid #e8e8ea;display:flex;align-items:center;justify-content:center;color:#5b5f68;font-size:16px}
      #swap-loading .skl b{display:block;border-radius:8px;background:#e8e8ea;}
      #swap-loading .skl .pill{width:98px;height:34px;border-radius:999px}
      #swap-loading .skl .amt{width:120px;max-width:45%;height:22px}
      #swap-loading .skl .btn{width:100%;height:52px;border-radius:14px;margin-top:12px;background:#fbe1d1;}
    </style>
  </head>

  <body>
    <noscript>
      <style>#root { display: none }</style>
      <p>Enable JavaScript to use the swap form.</p>
    </noscript>
    <div id="root">
      <div id="swap-loading" role="status" aria-label="Loading swap">
        <img src="/ophis-mono.svg" alt="Ophis" width="118" height="32" />
        <div class="skl" aria-hidden="true">
          <div class="row"><b class="pill"></b><b class="amt"></b></div>
          <div class="arw">↓</div>
          <div class="row"><b class="pill"></b><b class="amt"></b></div>
          <b class="btn"></b>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
