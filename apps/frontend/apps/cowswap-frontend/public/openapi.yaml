openapi: 3.0.3
info:
  title: Ophis Intent API
  version: '1.0.0'
  description: |
    Parses natural-language swap requests into structured `ParsedIntent`
    objects that the Ophis frontend (or an AI agent) can use to
    pre-fill a swap form or construct a deep-link.

    Backed by LibertAI's Qwen 3.6 27B (open-weights, hosted on Aleph
    Cloud) via a Cloudflare Pages Function proxy. The LibertAI API key
    is held server-side as a Pages environment secret, browsers and
    third-party agents never see it.

    **Trust model:** Ophis is non-custodial. This API does not place,
    sign, or execute trades, it only normalizes natural-language
    requests into structured entities. Order signing always happens in
    the user's wallet on the frontend.
  contact:
    name: Ophis operator
    url: https://swap.ophis.fi/#/contact
  license:
    name: Source available
    url: https://github.com/ophis-fi/ophis

servers:
  - url: https://ophis.fi
    description: Production

paths:
  /api/intent:
    post:
      operationId: parseIntent
      summary: Parse a natural-language swap request
      description: |
        Submit free-form English text (up to 280 chars). The proxy
        forwards it to LibertAI Qwen 3.6 27B with a pinned system
        prompt and `temperature: 0` to reduce extraction variability.
        Validate each response before using it. The response normalizes recognized tokens, the
        amount, and the target chain.

        Token values use bounded symbol syntax and must derive from
        the request text. The parser does not verify token contracts;
        resolve the chain/address and obtain a quote before signing.

        **Origin allowlist:** non-null `Origin` headers are checked
        against `https://ophis.fi` and `https://swap.ophis.fi`.
        Cloudflare Pages preview origins are not allowed. Browser-side calls from other origins return
        `403 FORBIDDEN`. Non-browser callers (curl, server-side
        scripts) that omit `Origin` entirely are allowed but subject
        to the per-IP rate limit.

        **Rate limit:** 30 requests per IP per rolling 60s window,
        enforced by a Cloudflare rate-limiting binding. Exceeding returns `429`
        with `Retry-After`.

        **Caching:** identical normalized text (lowercased + trimmed)
        from the same origin bucket is served from a 5-minute KV cache.
        Hits return `x-ophis-cache: hit` and do not consume an
        upstream LibertAI call. The rate-limit counter still
        increments on cache hits.
      tags:
        - intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentRequest'
            examples:
              simpleSwap:
                summary: Swap 100 USDC for ETH
                value:
                  text: 'swap 100 USDC for ETH on Base'
              memeBuy:
                summary: Buy PEPE with USDC
                value:
                  text: 'buy 50 USDC of PEPE on ethereum'
              chainShortform:
                summary: Chain shortform recognised
                value:
                  text: '1 ETH to USDC on op'
      responses:
        '200':
          description: Parsed intent
          headers:
            x-ophis-cache:
              description: '`hit` if served from KV cache; absent otherwise.'
              schema:
                type: string
                enum: ['hit']
            cache-control:
              description: Always `no-store`, clients must not cache.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentResponseOk'
              examples:
                success:
                  value:
                    ok: true
                    data:
                      intent: 'swap'
                      entities:
                        - { type: 'amount', value: '100', raw: '100', start: 5, end: 8 }
                        - { type: 'sellToken', value: 'USDC', raw: 'USDC', start: 9, end: 13 }
                        - { type: 'buyToken', value: 'ETH', raw: 'ETH', start: 18, end: 21 }
                        - { type: 'chain', value: 'base', raw: 'Base', start: 25, end: 29 }
        '400':
          description: Bad input (missing/oversized text, invalid JSON body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentResponseError'
              examples:
                missingText:
                  value:
                    ok: false
                    error: { code: 'BAD_INPUT', message: 'text required' }
                tooLong:
                  value:
                    ok: false
                    error: { code: 'BAD_INPUT', message: 'text exceeds 280 chars' }
        '403':
          description: Origin not on allowlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentResponseError'
              example:
                ok: false
                error: { code: 'FORBIDDEN', message: 'origin not allowed' }
        '429':
          description: Rate limit exceeded (30 req / 60s / IP)
          headers:
            retry-after:
              description: Seconds until the next request will be allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentResponseError'
              example:
                ok: false
                error: { code: 'RATE_LIMITED', message: 'too many requests' }
        '500':
          description: Operator configuration error (LibertAI key missing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentResponseError'
        '502':
          description: Upstream parser failure (LibertAI unreachable or non-2xx)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentResponseError'
        '504':
          description: Upstream parser timed out (>5s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentResponseError'

components:
  schemas:
    IntentRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 280
          minLength: 1
          description: |
            Natural-language swap request. Recognised entities: amount,
            sellToken (you're paying with), buyToken (you want),
            chain. Case-insensitive. The model uses `temperature: 0`
            to reduce variability; identical outputs are not guaranteed.

    Entity:
      type: object
      required: [type, value, raw, start, end]
      properties:
        type:
          type: string
          enum: [sellToken, buyToken, amount, chain]
        value:
          type: string
          description: |
            Normalized form (e.g. `USDC`, `0.5`, `optimism`). Tokens
            use bounded symbol syntax; chains use supported slugs.
            The value must derive from the request text. This does not
            verify a token contract or executable route.
        raw:
          type: string
          description: A case-insensitive match somewhere in the input.
        start:
          type: integer
          minimum: 0
          description: Model-proposed in-bounds start offset; re-anchor raw before highlighting.
        end:
          type: integer
          minimum: 1
          description: Model-proposed in-bounds end offset (exclusive); not an exact-span guarantee.

    ParsedIntent:
      type: object
      required: [intent, entities]
      properties:
        intent:
          type: string
          enum: [swap, unknown]
        entities:
          type: array
          items:
            $ref: '#/components/schemas/Entity'

    IntentResponseOk:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/ParsedIntent'

    IntentErrorCode:
      type: string
      enum:
        - TIMEOUT
        - UPSTREAM
        - INVALID_JSON
        - BAD_INPUT
        - RATE_LIMITED
        - FORBIDDEN

    IntentResponseError:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/IntentErrorCode'
            message:
              type: string

tags:
  - name: intent
    description: |
      Natural-language → structured swap intent. Parsing does not
      quote, sign or execute an order. Use the hosted MCP server or SDK
      for order building, and resolve the chain-specific orderbook:
      Ophis-operated chains use Ophis hosts; hosted chains use CoW Protocol.
