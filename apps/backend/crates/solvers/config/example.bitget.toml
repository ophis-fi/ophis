node-url = "http://localhost:8545"

[dex]
# Specify which chain to use, 1 for Ethereum.
# Supported chains: eth (1), bnb (56), base (8453), matic (137),
# arbitrum (42161), robinhood (4663).
chain-id = "1"

# Optionally specify a custom Bitget swap API endpoint
# endpoint = "https://bopenapi.bgwapi.io/bgw-pro/swapx/pro/"

# Partner code sent in the Partner-Code header (defaults to "cowswap")
# partner-code = "cowswap"

# Provision this empty file ONCE on persistent storage. Missing state refuses
# startup. The total cap does not reset on restart or at midnight; failures
# also consume requests. Required for Robinhood, recommended on every chain.
[dex.request-budget]
state-file = "/var/lib/bitget/requests"
max-requests = 100
min-interval = "10s"

[dex.credentials]
# Bitget API key (obtain from Bitget integration team)
api-key = "$BITGET_API_KEY"

# Bitget API secret for signing requests
api-secret = "$BITGET_API_SECRET"
