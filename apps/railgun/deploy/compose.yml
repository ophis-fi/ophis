name: ophis-railgun

services:
  rpc:
    image: caddy:2.11.7@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    user: '1000:1000'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    # The official binary requires its file capability even on port 8080.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      RAILGUN_RPC_TOKEN: ${RAILGUN_RPC_TOKEN:?Set the private RPC token}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /config:uid=1000,gid=1000,mode=0700
      - /data:uid=1000,gid=1000,mode=0700
    logging:
      options: { max-size: 10m, max-file: '2' }

  tunnel:
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    user: '1000:1000'
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./cloudflared.yml:/etc/cloudflared/config.yml:ro
      - ./credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on: [rpc]
    logging:
      options: { max-size: 10m, max-file: '2' }
