# infra/local/docker-compose.sepolia.yml
# Ophis Stage-2 stack — real Sepolia testnet (no anvil). Requires SEPOLIA_RPC_URL in .env.
# Boot: docker compose -f infra/local/docker-compose.sepolia.yml --env-file infra/local/.env up -d

# Log rotation. Added 2026-08-24 after the Robinhood outage, where
# robinhood-nitro-nitro-1's json-file log had grown to 182MB with no rotation
# configured anywhere in any stack. `docker logs --tail 8` then HANGS, so the
# node's logs were unreadable during the incident that needed them most, and the
# empty output read as "the node is silent" when it was in fact logging fine.
# Docker's default is unbounded; this caps every service at 300MB total.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "3"


services:
  db:
    logging: *default-logging
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    logging: *default-logging
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
      target: migrations
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://db/${POSTGRES_DB}?user=${POSTGRES_USER}&password=${POSTGRES_PASSWORD}
    # No volume needed — SQL files are baked into the migrations image at build time
    # (COPY database/ /flyway/ in the Dockerfile migrations stage)

  orderbook:
    logging: *default-logging
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
      target: orderbook
    restart: always
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      DB_WRITE_URL: ${DB_WRITE_URL}
      DB_READ_URL: ${DB_READ_URL}
      ETH_RPC_URL: ${SEPOLIA_RPC_URL}
    volumes:
      - ./configs/sepolia/orderbook.toml:/orderbook.toml:ro
    command: ["--config", "/orderbook.toml"]
    ports:
      - "127.0.0.1:8080:80"

  autopilot:
    logging: *default-logging
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
      target: autopilot
    restart: always
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      orderbook:
        condition: service_started
    environment:
      DB_WRITE_URL: ${DB_WRITE_URL}
      DB_READ_URL: ${DB_READ_URL}
      ETH_RPC_URL: ${SEPOLIA_RPC_URL}
    volumes:
      - ./configs/sepolia/autopilot.toml:/autopilot.toml:ro
    command: ["--config", "/autopilot.toml"]

  driver:
    logging: *default-logging
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
      target: driver
    restart: always
    depends_on:
      baseline:
        condition: service_started
    environment:
      ETHRPC: ${SEPOLIA_RPC_URL}
      ADDR: 0.0.0.0:80
    volumes:
      - ./configs/sepolia/driver.toml:/driver.toml:ro
    command: ["--config", "/driver.toml"]
    ports:
      - "127.0.0.1:8081:80"

  baseline:
    logging: *default-logging
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
      target: solvers
    restart: always
    environment:
      ADDR: 0.0.0.0:80
    volumes:
      - ./configs/sepolia/baseline.toml:/baseline.toml:ro
    # The solvers binary takes a subcommand; "baseline" selects the baseline solver engine
    command: ["baseline", "--config", "/baseline.toml"]
    ports:
      - "127.0.0.1:9001:80"

volumes:
  postgres:
