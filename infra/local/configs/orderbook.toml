eip1271-skip-creation-validation = true
bind-address = "0.0.0.0:80"

[shared]
node-url = "http://chain:8545"
simulation-node-url = "http://chain:8545"

[shared.tracing]
collector-endpoint = "http://tempo:4317"

[database]
write-url = "%DB_WRITE_URL"
read-url = "%DB_READ_URL"

[native-price-estimation]
estimators = [[{ type = "Driver", name = "baseline", url = "http://driver/baseline" }]]

[order-quoting]
price-estimation-drivers = [{ name = "baseline", url = "http://driver/baseline" }]

# Orderbook-native rate limiter (api-dx decision 10). SHIPS DISABLED (see the
# mainnet configs for the coordinated docs-table + limiter flip rule). No
# Cloudflare fronts the local stack, so CF-Connecting-IP is client-controlled
# here and must not be trusted.
[api.rate-limit]
enabled = false
requests-per-second = 5
burst = 20
trust-cf-connecting-ip = false
