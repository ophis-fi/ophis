# Ophis Optimism mainnet — Prometheus alert rules.
#
# Severities:
#   - critical: page Clement on Telegram immediately. Indicates the chain
#     is not settling, RPC is down, or money/orders are at risk.
#   - warning:  Telegram notify with no auto-page. Indicates degradation
#     trending toward critical.
#
# Naming convention: `OphisOp<Component><Symptom>` so that the metric
# label `alertname` is unambiguous when fanned out across chains
# (OphisOp, OphisOp, OphisMega prefixes — same rule set per chain).

groups:
  - name: ophis-op-availability
    interval: 30s
    rules:
      - alert: OphisOpAutopilotDown
        expr: up{job="autopilot"} == 0
        for: 5m
        labels:
          severity: critical
          chain: optimism
        annotations:
          summary: "OP autopilot scrape failing for >5m"
          description: "Prometheus cannot reach autopilot:9589/metrics. Auctions are not running. Check `docker compose ps autopilot` on the Mac mini."

      - alert: OphisOpDriverDown
        expr: up{job="driver"} == 0
        for: 5m
        labels:
          severity: critical
          chain: optimism
        annotations:
          summary: "OP driver scrape failing for >5m"
          description: "Prometheus cannot reach driver:80/metrics. Solver competition has stopped. Check `docker compose ps driver`."

      # ── The 2026-08-14 blind spot ───────────────────────────────────────────
      # OphisOpDriverDown above keys on the SCRAPE, and /metrics kept answering
      # for the whole 23h outage while /healthz returned 503 — so `up` never
      # dipped and a total loss of OP solving paged nothing above `warning`.
      # A driver that cannot observe a new block is down in every sense that
      # matters, whether or not its metrics port answers. OP blocks are 2s, so
      # an unchanged head across a 10m window is unambiguous.
      # Replay-verified 2026-08-15 (systematic mutation test): FIRES at the
      # incident timestamp (head frozen at 155567994, changes()==0) and is EMPTY
      # at a known-healthy control 3 days earlier.
      - alert: OphisOpDriverBlockStreamStalled
        expr: changes(driver_last_block_number[10m]) == 0
        for: 5m
        labels:
          severity: critical
          chain: optimism
        annotations:
          summary: "OP driver has not observed a new block in >10m"
          description: |
            driver_last_block_number is frozen at {{ $value }}-changes over 10m,
            i.e. the driver's block_stream cannot advance. Solving is stopped even
            though the container is up and scrapeable.

            Check the driver's own verdict first (it names the fault):
              curl -s localhost:8103/healthz
            "latest block was observed Ns ago" means the read path is broken, not
            the driver. Then test the proxy directly:
              curl -s -X POST localhost:4001/main/evm/10 -H content-type:application/json \
                -d '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}'
            ErrFailsafeTimeoutExceeded there = an upstream is eating the network
            budget; see OphisOpErpcNetworkFailsafeTimeouts.

      - alert: OphisOpOrderbookDown
        expr: up{job="orderbook"} == 0
        for: 5m
        labels:
          severity: critical
          chain: optimism
        annotations:
          summary: "OP orderbook scrape failing for >5m"
          description: "Prometheus cannot reach orderbook:9586/metrics. New orders may be failing to land. Check `docker compose ps orderbook` and confirm port 8300 accepts connections."

      - alert: OphisOpERPCDown
        expr: up{job="rpc-proxy"} == 0
        for: 3m
        labels:
          severity: critical
          chain: optimism
        annotations:
          summary: "OP eRPC proxy scrape failing for >3m"
          description: "Prometheus cannot reach rpc-proxy:4001/metrics. All upstream provider routing has stopped — everything downstream will start failing. Restart rpc-proxy container."

  - name: ophis-op-host-resources
    interval: 30s
    rules:
      # The 2026-06-15 outage: the Colima VM disk /dev/vdb1 (/var/lib/docker:
      # Postgres data + container logs) filled to 100%, wedging Postgres in an
      # ENOSPC checkpoint crash-loop and 500ing /quote + /auction. The app-level
      # up{} alerts stayed green (healthchecks hit stateless routes), so disk
      # exhaustion was invisible. These alerts page BEFORE Postgres dies. Filter
      # fstype="ext4" so the virtiofs Mac-host share at /Users/scep is ignored;
      # max by(device) dedupes the /dev/vdb1 -> /var/lib/docker bind.
      - alert: OphisOpHostDiskLow
        expr: |
          max by (device) (
            1 - (
              node_filesystem_avail_bytes{job="node-exporter", fstype="ext4"}
              / node_filesystem_size_bytes{job="node-exporter", fstype="ext4"}
            )
          ) > 0.80
        for: 10m
        labels:
          severity: warning
          chain: optimism
        annotations:
          summary: "Colima VM disk {{ $labels.device }} >80% full"
          description: "A VM ext4 filesystem is over 80% used. The docker data disk /dev/vdb1 (/var/lib/docker: Postgres + container logs) filling to 100% wedges Postgres in an ENOSPC crash-loop and 500s /quote + /auction (the 2026-06-15 outage). Check `colima ssh -- df -h`; find the hogs with `colima ssh -- sudo sh -c 'du -h /var/lib/docker/containers/*/*-json.log | sort -rh | head'` and `truncate -s 0` them (never rm)."
      - alert: OphisOpHostDiskCritical
        expr: |
          max by (device) (
            1 - (
              node_filesystem_avail_bytes{job="node-exporter", fstype="ext4"}
              / node_filesystem_size_bytes{job="node-exporter", fstype="ext4"}
            )
          ) > 0.90
        for: 5m
        labels:
          severity: critical
          chain: optimism
        annotations:
          summary: "Colima VM disk {{ $labels.device }} >90% full, Postgres ENOSPC imminent"
          description: "A VM ext4 filesystem is over 90% used. Postgres (OP + megaeth share this disk) will hit ENOSPC and crash-loop, taking the orderbook down. Free space NOW: truncate the largest /var/lib/docker/containers/*/*-json.log (eRPC rpc-proxy is the usual culprit; never rm). Runbook: infra/optimism-mainnet/README.md, 'disk full -> Postgres crash-loop'."
      - alert: OphisOpNodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 10m
        labels:
          severity: warning
          chain: optimism
        annotations:
          summary: "node-exporter scrape failing for >10m, disk alerting is blind"
          description: "Prometheus cannot reach node-exporter:9100. The disk-exhaustion alerts (OphisOpHostDisk*) cannot fire while this is down. Check `docker compose ps node-exporter` on the Mac mini."

  - name: ophis-op-settlement-health
    interval: 30s
    rules:
      - alert: OphisOpAutopilotMaintenanceStalled
        # ⚠️ TWO CORRECTIONS FROM CODEX REVIEW, both verified in the autopilot
        # source before being accepted (maintenance.rs:167-198):
        #
        # 1. THE HEAD OPERAND WAS WRONG. This first used
        #    `..._maintenance_last_seen_block` as the head. But index_until_block
        #    sets last_seen_block IMMEDIATELY BEFORE awaiting
        #    run_essential_maintenance, and the surrounding loop cannot iterate
        #    until that await returns. So if maintenance HANGS (a wedged DB query,
        #    an RPC that never resolves) last_seen_block freezes too, the
        #    subtraction stays at ~1, and this alert never fires — while claiming
        #    in its own description to cover exactly that case. It only worked on
        #    08-23 because maintenance was RETURNING AN ERROR, which lets the loop
        #    keep iterating. `gp_v2_autopilot_last_block_number` is set by the
        #    block stream itself (ethrpc/src/block_stream.rs), so it advances
        #    whether maintenance errors, hangs, or succeeds. Verified live: same
        #    label set (instance, job), so the subtraction matches.
        #
        # 2. IT IS NOT SETTLEMENT-SPECIFIC, so it is no longer named as if it is.
        #    last_updated_block advances only after run_essential_maintenance
        #    succeeds, and that is a tokio::try_join! over THREE indexers:
        #    settlement, CoW AMM, and ethflow. try_join! fails if any one fails,
        #    so a broken ethflow indexer would have raised a critical page saying
        #    settlements, rebates and stats were stale when they were current, and
        #    sent the operator hunting an archive-RPC quorum problem that did not
        #    exist. The alert now says which three things it covers and tells you
        #    to identify the failing one first.
        #
        # THE 2026-08-23 BLIND SPOT. The autopilot's settlement-event indexer
        # wedged at block 155950754 for 4+ hours and NOTHING here paged about it.
        # What eventually paged was OphisOpErpcUpstreamCredentialFailing on
        # publicnode-op — a symptom one layer down, an hour late, naming the wrong
        # subject. Chain of causation that day:
        #   publicnode's free tier serves eth_getLogs only within ~128 blocks of
        #   head (deeper -> jsonrpc -32602 "Archive requests require a personal
        #   token"), validationcloud had been HTTP 401 since 08-18, so archive
        #   eth_getLogs had exactly ONE capable lane (zan) — below
        #   agreementThreshold:2 -> ErrConsensusDispute -> returnError. Once the
        #   indexer fell past that ~128-block line it could never catch up: a trap
        #   door, not a transient. It re-requested one 500-block window ~3.5x/sec
        #   for four hours while /quote stayed green the whole time.
        #
        # This alert watches the OUTCOME (is settlement indexing advancing?)
        # rather than any particular lane's health, so it fires for ANY cause:
        # lane death, archive gating, quorum loss, a wedged DB, an eRPC bug.
        #
        # Threshold, measured on this stack's own 7d TSDB (2026-08-23):
        #   p50 lag = 0 blocks, p95 = 2 blocks. Steady state is level with head.
        #   300 blocks is ~150x p95 and ~10 min of OP's 2s blocks, comfortably
        #   past publicnode's ~128-block archive gate, so a normal brief catch-up
        #   cannot reach it. Replayed against 08-23: crosses 300 at 16:25:18Z,
        #   fires 16:40Z — ~1h BEFORE the credential alert actually paged.
        # `for: 15m` (not 5m) because a driver/autopilot restart legitimately
        # replays a short backlog; 15m of no forward progress is not that.
        expr: |
          (
            gp_v2_autopilot_last_block_number
            - gp_v2_autopilot_autopilot_maintenance_last_updated_block
          ) > 300
        for: 15m
        labels:
          severity: critical
          chain: optimism
        annotations:
          summary: "OP autopilot essential maintenance stalled {{ $value | printf \"%.0f\" }} blocks behind head"
          description: |
            `last_updated_block` has not caught up to the chain head for 15
            minutes, so autopilot essential maintenance is not completing.

            THAT IS THREE INDEXERS, NOT ONE. run_essential_maintenance is a
            try_join! over the settlement indexer, the CoW AMM indexers and the
            ethflow order indexers; it advances the gauge only when ALL of them
            succeed, so ANY one of them failing raises this page. Identify which
            before concluding settlements are affected:
              docker logs optimism-mainnet-autopilot-1 --tail 100 \
                | grep -iE "settlement_indexer|cow_amm_indexer|ethflow_order_indexer"

            If it IS the settlement indexer, settlements landing on-chain are not
            being indexed: order status, rebates and the stats page all stall
            behind it, and the autopilot's own view stops advancing.

            Quoting can look perfectly healthy while this is broken — /quote
            reads at tip, this indexes history. Do not use /quote to clear it.

            FIRST, get the block range it is stuck on:
              docker logs optimism-mainnet-autopilot-1 --tail 50 \
                | grep -o "unable to get logs for blocks range [0-9-]*" | sort -u

            THEN ask why that range cannot be served. The usual cause is that
            fewer than agreementThreshold:2 upstreams can serve eth_getLogs AT
            THAT DEPTH — which is NOT the same question as whether the lanes are
            up. publicnode is archive-gated at ~128 blocks, so it votes on
            tip-adjacent getLogs and abstains on everything older:
              curl -s localhost:9091/api/v1/query --data-urlencode \
                'query=sum by (upstream,error) (rate(erpc_upstream_request_errors_total{network="evm:10"}[15m]))'

            Confirm by probing a lane DIRECTLY at the stuck depth, not at tip:
            a tip-only probe reports a lane healthy when it cannot serve a single
            historic window.

            Fix the lane math (restore a second archive-capable, non-Cloudflare
            upstream — see configs/erpc.yaml.tmpl); the indexer then catches up
            on its own. Do NOT recreate the driver to "unstick" it: that costs
            minutes of cold NoSolutions and does not touch the cause.

      - alert: OphisOpNoSettlements1h
        # IntCounterVec `settlements{solver, result}` is monotonic. We want
        # to alert when `result="success"` hasn't incremented in 1h despite
        # auctions running (so we don't alert on quiet periods with no
        # orders). Detect quiet vs. broken by checking that the auction
        # loop IS ticking — autopilot exposes `auction_preprocessing` as a
        # histogram that increments on every auction.
        # 2026-08-09 audit: this alert had NEVER been able to fire — THREE
        # independent defects, found while asking why a 2h all-solvers outage
        # paged nothing:
        #   1. bare `settlements` / `auction_preprocessing_count` do not exist;
        #      the services register `driver_`-prefixed names.
        #   2. the result label value is "Success" (capitalized), not "success".
        #   3. `driver_settlements` is a lazy counter vec — after a driver
        #      restart with no settlement yet there are NO series, and
        #      `increase(<empty>) == 0` matches nothing. `or vector(0)` closes
        #      that absent-series hole (which was live: last settlement
        #      2026-07-31, driver restarted 08-07, incident 08-09).
        # Verified against the live TSDB: metric names, label shapes, and a
        # replay of this expr at the 08-09 incident time (fires) vs a quiet
        # window (does not fire).
        # Since #1157 the driver pre-creates the {solver,"Success"} children
        # at startup, so the first settlement after a restart is an
        # observable 0->1 transition (before that, it was born at 1 and this
        # alert kept firing ~1h past a successful settlement).
        # Accepted residual (2026-08-09 round-11 review): a settlement
        # completing AFTER driver start but BEFORE the first 15s scrape
        # would still be born at 1. Physically excluded on this stack, by
        # measurement: a freshly recreated driver needs minutes of liquidity
        # warmup before any auction solves (observed 2026-08-09), and the
        # fastest observed order-to-settlement was 24s on a WARM driver — no
        # settlement can complete within one scrape interval of boot. Not
        # worth an extra suppression arm on a critical alert's readability.
        expr: |
          (sum(increase(driver_settlements{result="Success"}[1h])) or vector(0)) == 0
          and on() (sum(increase(driver_auction_preprocessing_count[1h])) > 0)
        for: 5m
        labels:
          severity: critical
          chain: optimism
        annotations:
          summary: "OP: 0 successful settlements in 1h despite active auctions"
          description: "Auctions are running (auction_preprocessing_count > 0) but no settlement has succeeded in the last hour. Common causes, in order of likelihood: (1) solver stuck — check `solutions{result}` breakdown; (2) RPC submission failing — check `mempool_submission{result}` and publicnode status; (3) driver-submitter wallet out of ETH — `cast balance 0x92B9bE5e96795E8630fDC61efb0e705E75b1A1B1 --rpc-url https://optimism-rpc.publicnode.com`."

      - alert: OphisOpSettlementFailureRateHigh
        # 2026-08-09: renamed bare `settlements` -> `driver_settlements` and
        # fixed the label value case ("Success"). The old lowercase filter
        # would have counted every Success as a failure once settlements
        # resumed — a guaranteed false page.
        expr: |
          (
            sum(rate(driver_settlements{result!="Success"}[15m]))
            /
            sum(rate(driver_settlements[15m]))
          ) > 0.05
        for: 10m
        labels:
          severity: critical
          chain: optimism
        annotations:
          summary: "OP settlement failure rate > 5% over 15m"
          description: "More than 5% of OP settlement attempts are failing. Most likely causes: pool liquidity collapse, gas-price cap too tight, RPC provider issues. Inspect driver logs for revert reasons."

      # Sharp-edges audit F3+F7 (2026-05-21): post-A1 mitigation the driver
      # races 3 distinct mempools in parallel via select_ok (PublicNode +
      # OP Foundation gateway + Tenderly). A single provider going down
      # drives the per-attempt failure ratio to ~33% (1 of 3) while
      # end-to-end submission still succeeds — that should NOT page.
      # Threshold bumped 10% → 35% to ignore single-provider outages;
      # genuine multi-provider degradation (2 of 3 down or sustained
      # cap-rejection across all 3) still trips. To attribute the failure
      # to a specific provider, drill down via `mempool_submission{mempool=...}`.
      - alert: OphisOpMempoolSubmissionFailing
        # 2026-08-09: renamed to `driver_mempool_submission`; result values are
        # {"Success","Other"} (verified in TSDB), so filter on !="Success".
        #
        # 2026-08-09 codex round 2: the old failure-RATIO (>0.35) was
        # structurally meaningless. Mempools::execute races providers via
        # select_ok and DROPS the remaining futures on first success
        # (driver/src/domain/mempools.rs:66, `_remaining_futures`), so
        # observe::mempool_executed only counts futures that COMPLETED before
        # the winner: one fast failure + one success scores 50% (false page),
        # while two hung providers + one fast success scores 0% (hides a
        # 2-of-3 degradation). Reframed as an OUTAGE alert: failures observed
        # AND zero successes over the window — immune to the undercount in
        # both directions. Partial-provider degradation is NOT observable from
        # this metric at all (cancelled futures increment nothing); that needs
        # per-provider instrumentation in the driver.
        #
        # 2026-08-09 (codex rounds 2-5): see the gas-cap alert for the full
        # lazy-child history — every samples-only form had a hole (missed
        # day-one outage, missed bursts, false page on a healthy restart's
        # newly-born Success child, missed reborn-at-same-value children).
        # Round 5: Mempools::try_new pre-creates every (mempool, result)
        # child at 0 — all 6 result values, registry-asserted by a driver
        # unit test — so rate() always has real series and transitions.
        # Round 7 asymmetry note: unlike the gas-cap alert, this one does
        # NOT need a change-detector arm for the >15m-outage boot-window
        # case — submission failures during an outage REPEAT, so rate() has
        # two samples and fires within a scrape or two of continued failures;
        # a cap violation can be a single event, which is why only the
        # gas-cap expr carries the union.
        # Fires: failing submissions with ZERO successes over 15m, i.e. a
        # submission outage. Only sound on drivers that pre-initialize
        # (deployed together with that driver build).
        expr: |
          sum(rate(driver_mempool_submission{result!="Success"}[15m])) > 0
          and on() (sum(rate(driver_mempool_submission{result="Success"}[15m])) == 0)
        for: 5m
        labels:
          severity: warning
          chain: optimism
        annotations:
          summary: "OP: mempool submissions failing with ZERO successes over 15m"
          description: "Settlement submissions are failing and NO submission has succeeded in the last 15m — a submission outage, not a partial degradation. (This alert deliberately does not measure a failure ratio: select_ok cancels the losing futures on first success, so the counter only sees completed attempts and any ratio over it is misleading; a single degraded provider is invisible here by construction.) Inspect `driver_mempool_submission{mempool=...,result=...}` series to identify the failing lane(s). Causes: RPC provider degradation across the submission relays, nonce-race regression, gas-price cap rejection (see `driver_gas_price_cap_exceeded`). Trace via `driver::infra::submission` logs."

      - alert: OphisOpSolverDropRateHigh
        # 2026-08-09: renamed to driver_-prefixed metrics. driver_dropped_solutions
        # is lazily registered (no series until the first drop) — harmless here,
        # since absence means a zero numerator, i.e. nothing to alert on.
        # 2026-08-09 codex round 2: aggregate EACH metric before adding.
        # driver_solutions carries a `result` label and driver_dropped_solutions
        # a `reason` label; raw vector addition matches on the full label set,
        # so the inner sum produced an empty denominator the moment drops
        # existed — the alert could still never fire. sum by (solver) each side
        # first, then add.
        # 2026-08-09 codex round 3: denominator restricted to result="Success".
        # observe::solved counts EVERY solve outcome in driver_solutions —
        # SolutionNotFound and request errors included (observe/mod.rs:257) —
        # while driver_dropped_solutions counts discarded real proposals.
        # An unrestricted denominator dilutes the drop rate with non-proposals,
        # letting a solver whose actual proposals are mostly dropped sit far
        # below the 50% threshold.
        expr: |
          (
            sum by (solver) (rate(driver_dropped_solutions[15m]))
            /
            (sum by (solver) (rate(driver_solutions{result="Success"}[15m])) + sum by (solver) (rate(driver_dropped_solutions[15m])))
          ) > 0.50
        for: 15m
        labels:
          severity: warning
          chain: optimism
        annotations:
          summary: "OP {{ $labels.solver }} dropping >50% of solutions over 15m"
          description: "Solver `{{ $labels.solver }}` is dropping more than half its proposed solutions on OP. Likely cause: simulator reverts, slippage clip, settlement-balance issues. Check driver logs for `dropped_solutions{reason}` breakdown."

      # Codex audit follow-up (2026-05-20, task #116): simulation-revert
      # spike detection. The residual risk after restoring eth_call to
      # consensus (task #115) is that a real attacker could still poison
      # individual reads for the period before the misbehavior threshold
      # kicks in. This alert catches the downstream effect: simulations
      # that passed in eRPC but reverted on-chain (or that revert during
      # sim).
      - alert: OphisOpSimulationRevertSpike
        # SimulationRevert: solution dropped because simulation reverted.
        # Sustained >0.5/s = 30 in 60s = unusual under normal traffic
        # (testnet baseline was <1/min from KyberSwap occasional misroutes).
        # Threshold tuned to catch poisoning, not real-but-failing orders.
        #
        # Process-uptime gate (sharp-edges audit 2026-05-20 N3): driver
        # hot-reloads cause a sim-replay burst against potentially-stale
        # balance snapshots. Don't alert until the driver has been up
        # for 5m to swallow that transient. Otherwise back-to-back
        # restarts during a config roll would false-page Clement.
        # 2026-08-09: renamed to driver_dropped_solutions (lazy vec — absence is
        # a zero numerator, safe). The reason label value "SimulationRevert"
        # could not be TSDB-verified (no drop has occurred within retention);
        # re-check it the first time this metric materializes.
        # 2026-08-09 codex round 2: `and on()` not `and on(instance)` — the
        # left side's sum() strips the instance label, so an instance-keyed
        # join could never match and the alert stayed unfirable. The uptime
        # guard is a global gate, not a per-instance join.
        # 2026-08-09 round 6: uptime gate REMOVED entirely — the Rust
        # services register no process collector, so
        # process_start_time_seconds exists only for node-exporter /
        # prometheus / rpc-proxy (TSDB-verified BY JOB, not just by name).
        # The `and on()` join against an empty vector made this alert
        # unfirable since inception, through every prior repair round.
        # The gate's warmup-suppression intent (sharp-edges N3 above) is
        # already covered by `for: 15m`, which outlives any driver warmup.
        # LESSON: TSDB-verify every metric name WITH its matchers — a name
        # that exists for a different job still yields an empty join.
        # Round 7: an `up`-based restart guard was rejected on measurement —
        # a driver container recreate did not dip `up{job="driver"}` (the
        # swap is faster than the 15s scrape cadence), so it could not bind.
        # Round 10 (with the driver now registering ProcessCollector): the
        # ORIGINAL uptime gate is restored and finally bindable. NOTE the
        # metric name: the driver's storage registry namespaces everything,
        # so the series is driver_process_start_time_seconds — the deploy-day
        # TSDB check caught the unprefixed name failing to bind (verified
        # live 2026-08-09 21:10: prefixed name resolves, uptime ~132s).
        # Warmup replay bursts within 5m of driver start are suppressed;
        # `for: 15m` still covers the tail. TSDB-verify the series after
        # every driver image change: if the process feature is ever dropped,
        # this gate silently returns to unfirable (the round-6 defect).
        expr: |
          sum(rate(driver_dropped_solutions{reason="SimulationRevert"}[10m])) > 0.5
          and on() ((time() - driver_process_start_time_seconds{job="driver"}) > 300)
        for: 15m
        labels:
          severity: critical
          chain: optimism
        annotations:
          summary: "OP: simulation-revert rate >0.5/s sustained over 15m"
          description: "Driver is dropping >30 solutions/min due to simulation reverts. Most-likely causes (priority order): (1) hostile eRPC upstream feeding forged-pass sims that revert at broadcast — check `rpc_upstream_responses_total{result=\"misbehavior\"}` for anomalies and consider sit-out tightening; (2) solver bug introducing impossible routes — bisect by `solver` label; (3) chain congestion making gas estimates stale — check `eth_feeHistory` upstream latency. Driver logs filter: `grep 'SimulationRevert' on driver-1`."

      # Codex audit follow-up (2026-05-20 N3): the `OphisOpMatchedUnsettledGrowth`
      # alert previously here used `gp_v2_autopilot_runloop_matched_unsettled`
      # which increments for ranked NON-WINNING solution orders, not
      # "broadcast but never landed". That's normal competition noise
      # under healthy traffic — would alert constantly on launch.
      # REMOVED. Proper alert needs a metric tied to submitted-and-winning
      # settlements not observed on-chain; left as a roadmap item.

  - name: ophis-op-erpc-consensus
    # ── NO UPSTREAM ALLOWLIST IN THIS GROUP. THIS IS DELIBERATE. ──
    # Every per-upstream rule below selects on network="evm:10" ONLY. Do not
    # "tidy" them by adding upstream=~"lane-a|lane-b|..." back.
    #
    # They used to carry that allowlist, duplicated across 11 selectors. It made
    # swapping a lane a silent monitoring regression: the new lane was invisible
    # to every one of these rules until someone remembered to hand-edit all 11.
    # That is the same defect shape as the 2026-08-18 incident, where
    # OphisOpErpcUpstreamCredentialFailing matched an error label eRPC never
    # emits and so watched an empty vector through a five-day lane death. Both
    # times the alert existed, was well written, and could not fire.
    # Unpinned 2026-08-23 while swapping validationcloud-op -> official-op.
    #
    # Nothing is lost by unpinning: assert-erpc-failclosed.py CI-enforces
    # EXPECTED_UPSTREAMS = 3 and pins the three hostnames, so the upstream set
    # cannot drift without a guard failure and a deliberate edit. The allowlist
    # here was never the control; it was a second copy of the control that
    # rotted independently of it.
    #
    # THE COST OF UNPINNING, AND ITS FIX: these rules now match every upstream
    # in the TSDB, retired lanes included (alchemy-op, ophis-self-op,
    # tenderly-op and validationcloud-op are all still inside the 15d window).
    # A lane eRPC has stopped routing to has a collapsing request rate against a
    # still-decaying error rate, and clamp_min(...,0.001) turns that into a
    # nonsense figure — validationcloud-op was observed FIRING at a "234% error
    # ratio" on 2026-08-23, hours after it left the config. Every ratio rule
    # below therefore carries a live-traffic floor:
    #
    #     and sum by (upstream) (rate(erpc_upstream_request_total{...}[1h])) > 0.005
    #
    # ⚠️ THE WINDOW IS 1h AND THE FLOOR IS DELIBERATELY TINY (Codex review,
    # 2026-08-24). The first version used [15m] > 0.05 and that was wrong in the
    # dangerous direction: when a lane's circuit breaker opens, eRPC stops
    # routing to it and only half-opens every 30s, so its request rate collapses
    # far below 0.05 req/s while the lane is still CONFIGURED and completely
    # unusable. A 15m window would have let the very alerts that exist to catch
    # a dead lane reset themselves before their own `for:` elapsed — the exact
    # failure that hid robinhood-official's stuck breaker for eight hours on
    # 08-23. Over an hour, a breaker-ejected lane still carries the traffic it
    # served before ejection, so it stays above the floor long enough to page;
    # a lane genuinely removed from the config decays to zero and drops out.
    # The cost is that a retired lane can page for up to an hour after removal,
    # which is the right way round: a false page about a lane that just left
    # beats silence about a lane that is still admitted and broken.
    # All of this is mutation-tested in alerts_test.yml: re-pin the selectors and
    # the unknown-lane case fails; drop the floor and the retired-lane case pages.
    interval: 30s
    rules:
      # Codex Cyber post-merge recommendation (2026-05-18): track consensus
      # error rate after removing `ignoreFields:[timestamp]` (PR #71). Catches
      # any unexpected availability regression on the consensus-protected
      # methods. Split by error type so an operator can distinguish "providers
      # diverging on response value" (dispute) from "providers not responding"
      # (low_participants) at a glance.
      #
      # Source metric: erpc_consensus_errors_total — labels:
      #   - error: dispute | low_participants | consensus_on_error
      #   - category: eth_call | eth_getBlockByNumber | eth_getBlockByHash |
      #               eth_getLogs | eth_getTransactionReceipt | eth_getTransactionByHash
      #   - finality: finalized | unfinalized | realtime | unknown
      #   - network: evm:10
      - alert: OphisOpErpcConsensusLowParticipantsHigh
        expr: |
          sum by (category) (
            rate(erpc_consensus_errors_total{network="evm:10",error="low_participants"}[5m])
          ) > 5
        for: 10m
        labels:
          severity: warning
          chain: optimism
        annotations:
          summary: "OP eRPC low-participants > 5/s on {{ $labels.category }} for 10m"
          description: |
            eRPC is failing consensus because fewer than 2 of 3 upstreams respond
            within the retry budget for `{{ $labels.category }}` requests. Sustained
            elevation indicates one or more OP upstream(s) (publicnode / zan /
            official-op) are slow or unavailable.

            ⚠️ 2026-08-09 lesson: this alert only trips at >5/s, which assumes
            steady driver/orderbook polling. A LOW-TRAFFIC stack with one live
            order fails every auction at well under 5 consensus errors/s — the
            08-09 swap outage (every solver NoSolutions for 2h) never crossed
            this threshold. If users report stuck swaps, check
            `docker logs optimism-mainnet-autopilot-1 | grep 'no solutions'`
            regardless of whether this alert fired.

            Diagnose: set UPSTREAM to each endpoint listed in the rendered erpc.yaml and run
            `cast block-number --rpc-url "$UPSTREAM"` to find which one is unresponsive. Check rpc-proxy logs:
            `docker logs optimism-mainnet-rpc-proxy-1 --tail 50 | grep low_participants`

            Threshold history: 5/s ≈ 100% failure on `eth_call` consensus path
            (driver/orderbook poll ~5/s steady state).

      # WHY THIS EXISTS: OphisOpErpcConsensusLowParticipantsHigh above watches
      # erpc_consensus_errors_total{error="low_participants"}, and that counter
      # CANNOT move. eRPC counts an ERRORED upstream as a collected participant,
      # so lowParticipantsBehavior:returnError never triggers; a shortfall is
      # classified as a dispute and resolved by preferBlockHeadLeader, which
      # serves the lone valid answer. Measured over 24h on 2026-09-04:
      #   low_participants  0
      #   dispute           0
      #   ops resolved on <=1 agreeing lane   17,144 of 315,129  (5.4%)
      # Two alerts read zero all day while one in eighteen settlement-gating
      # reads was trusted to a single provider. The agreement histogram is the
      # only place the shortfall is visible, so alert on that instead.
      # Expected to sit near zero once the state-poller freshness race is fixed;
      # if it climbs again, a lane is being excluded, not disagreeing.
      - alert: OphisOpErpcConsensusThinMargin
        expr: |
          (
            sum(rate(erpc_consensus_agreement_count_bucket{network="evm:10", le="1.0"}[15m]))
            /
            sum(rate(erpc_consensus_agreement_count_count{network="evm:10"}[15m]))
          ) > 0.01
          and
          sum(rate(erpc_consensus_agreement_count_count{network="evm:10"}[15m])) > 0.05
        for: 15m
        labels:
          severity: warning
          chain: optimism
        annotations:
          summary: "OP eRPC consensus resolving on a single agreeing lane"
          description: |
            More than 1% of OP consensus operations are resolving with at most ONE
            agreeing upstream, and are being served as authoritative anyway. The
            configured quorum is 2-of-3; the real agreement margin right now is 1.

            This does NOT show up in erpc_consensus_errors_total. An errored
            upstream still counts as a collected participant, so lowParticipants
            never fires and the shortfall is resolved by preferBlockHeadLeader
            picking the lone valid answer. Both of those counters can read zero
            while this is happening.

            Diagnose by asking whether lanes are DISAGREEING or being EXCLUDED:
            compare erpc_upstream_request_errors_total by error label per upstream.
            ErrUpstreamBlockUnavailable means excluded on freshness, not wrong:
            enforceHighestBlock drops any upstream behind the network-known
            highest, the state poller is request-driven, so the busiest lane
            defines the tip and the quiet lanes are excluded on every new block.
            Check statePollerInterval against the chain block time before
            suspecting a provider. ErrEndpointCapacityExceeded instead means a
            provider is rate-limiting us and the lane needs its share reduced.

            Integrity issue, not availability: quotes and settlement keep working,
            they are just trusting one provider. Do NOT tighten disputeBehavior to
            returnError while this is elevated, or every one of these becomes a
            hard failure and the driver pauses. Fix the exclusion first, confirm
            this alert clears, then tighten.
      - alert: OphisOpErpcConsensusDisputeHigh
        expr: |
          sum by (category) (
            rate(erpc_consensus_errors_total{network="evm:10",error="dispute"}[5m])
          ) > 5
        for: 15m
        labels:
          severity: warning
          chain: optimism
        annotations:
          summary: "OP eRPC dispute rate > 5/s on {{ $labels.category }} for 15m"
          description: |
            Upstream OP providers are returning DIFFERENT responses for the same
            request — fork-view-poisoning suspect OR natural tip drift. 2-of-3
            consensus is failing because responses don't match.

            Sustained > 2/s is unusual: it means either (a) one of the 3
            upstreams is on a fork / lagging behind the others, OR (b) a
            specific request pattern is triggering deterministic disagreement
            (e.g., a `latest`-tag query that resolves to different blocks).

            On OP, expect occasional disputes on tip queries (PR #71 trade-off).
            Sustained elevation = investigate which upstream is drifting:
              cast block-number --rpc-url https://optimism-rpc.publicnode.com
            For ZAN and Validation Cloud, build each URL from its key in .env
            without pasting the key into shared terminals or logs.
            and compare. Provider > 5 blocks behind the median should be
            sit-out-penalized by eRPC's punishMisbehavior — verify.

      - alert: OphisOpErpcConsensusFailureCritical
        expr: |
          (
            sum(rate(erpc_consensus_errors_total{network="evm:10"}[5m]))
            /
            sum(rate(erpc_consensus_total{network="evm:10"}[5m]))
          ) > 0.7
        for: 15m
        labels:
          severity: critical
          chain: optimism
        annotations:
          summary: "OP eRPC > 70% of consensus calls failing for 15m"
          description: |
            More than half of all consensus operations on the OP eRPC proxy are
            failing. This is a real availability incident — driver / autopilot /
            orderbook will stall, no new settlements can broadcast, in-flight
            settlements will revert.

            Likely cause: 2 of 3 upstream OP providers simultaneously degraded
            (rate-limit, outage, or DNS). PR #71 (timestamp ignore removed) can
            contribute extra disputes but should not push the overall failure
            rate above 50%.

            Immediate actions:
              1. Identify which upstreams are down via direct probe
              2. Consider emergency hot-swap to a known-healthy provider
                 (see project_ophis_roadmap.md section 3 reliability map)
              3. Worst case: temporarily lower agreementThreshold to 1 (NOT
                 audit-compliant — revert as soon as providers recover)

      # ============================================================
      # Per-upstream staleness — pairs with task #119
      # (split disputeThreshold by method, configs/erpc.yaml.tmpl).
      # The split lowered the critical-path threshold to 60 (Block A);
      # block-head-lag surfaces the dominant root cause of dispute
      # churn so the operator can fix the upstream instead of just
      # raising the threshold.
      # ============================================================

      # ── Cordon alerts dropped (this PR / 2026-05-21) ────────────
      #
      # Two rules were previously here:
      #   - OphisOpErpcUpstreamCordoned (== 1 gauge check)
      #   - OphisOpErpcCordonMetricAbsent (absent() guard for renames)
      #
      # They were dropped after a false-positive caused by THIS PR's
      # own success: removing eth_getTransactionReceipt from consensus
      # eliminated the chronic-cordon source that kept
      # `erpc_upstream_cordoned` "warm". eRPC initializes that series
      # lazily — only after the first cordon event per upstream — so
      # absence in steady-state operation is normal, not a problem.
      #
      # That makes `absent(erpc_upstream_cordoned)` indistinguishable
      # from "metric renamed by version change" (the rename it was
      # supposed to detect), and the == 1 gauge check is also unreliable
      # because eRPC v0.0.64+ moved per-upstream punishment to a
      # score-based system (`erpc_upstream_score_overall`,
      # `erpc_consensus_upstream_punished_total`).
      #
      # Net replacement coverage:
      #   - Real consensus failures still page via
      #     OphisOpErpcConsensusLowParticipantsHigh / Dispute / Failure
      #     (already in this file, lines ~185-262).
      #   - Per-upstream sync-trouble surfaces via the BlockHeadLagging
      #     alert below (unchanged).
      #   - If a future eRPC ever drops the consensus metrics too,
      #     OphisOpERPCDown (up{job="rpc-proxy"} == 0) still catches
      #     a broken scrape — the actual visibility we cared about.
      # ────────────────────────────────────────────────────────────

      # `OphisOpErpcUpstreamBlockHeadLagging` — chronic-lag root-cause
      # detector. Standalone signal — no longer paired with a Cordoned
      # alert (see above for why those were dropped). The block_head_lag
      # gauge is simpler than the stale_latest_block_total counter (which
      # is a per-category rate and harder to interpret). Threshold of 5
      # blocks = ~10 seconds of OP block time = real lag, not microsecond drift.
      - alert: OphisOpErpcUpstreamBlockHeadLagging
        # Pin alerts to admitted voters. Prometheus retains retired-upstream
        # series after a hot-swap; without this allowlist the removed lane can
        # page again from historical samples even though eRPC no longer uses it.
        expr: erpc_upstream_block_head_lag{network="evm:10"} > 5
        for: 15m
        labels:
          severity: warning
          chain: optimism
        annotations:
          summary: "OP eRPC upstream {{ $labels.upstream }} >5 blocks behind for 15m"
          description: |
            The {{ $labels.upstream }} upstream has been more than 5 blocks
            behind the median for 15 minutes. This is the dominant root
            cause of dispute churn on Block A consensus methods (eth_call,
            eth_getBalance) — the chronically-lagging upstream returns
            stale state, gets disputed, eventually gets cordoned by
            punishMisbehavior.

            All three lanes are now third-party providers; a lag here is a
            provider-side regression. Compare heads per lane, then consider a
            hot-swap if it is sustained > 1h.

            ⚠️ A lane that is DEAD rather than lagging is the more dangerous
            case and this alert is not the one that catches it: on 2026-08-14 the
            retired self-hosted lane went away entirely and every tip-following
            read failed with ErrFailsafeTimeoutExceeded for 23h. The alert that
            binds that failure is OphisOpErpcNetworkFailsafeTimeouts below —
            a dead upstream at routing priority 1 can outlast the 12s network
            budget before failover, so watch network-level timeouts, not just lag.

      # ── Network-level budget exhaustion (2026-08-14 incident) ───────────────
      # WHY THIS EXISTS: every other eRPC alert here keys off CONSENSUS or off a
      # single upstream's error counters. The 2026-08-14 failure produced neither.
      # The owned-node lane went away completely; eRPC held it at routing priority
      # 1, and its per-upstream budget (8s timeout x 3 attempts) is larger than the
      # 12s network-level failsafe — so requests died at the NETWORK layer with
      # lastUpstream=nil before any upstream counter was attributed and before
      # consensus was ever reached. Consensus metrics stayed clean while ~20% of
      # all traffic (every tip-following read) failed for 23 hours.
      #
      # This alert watches the one counter that did move. It binds any cause of
      # network-budget exhaustion, not just a dead lane.
      # Replay-verified 2026-08-15: FIRES at the incident timestamp (0.316/s) and
      # is EMPTY at a known-healthy control 3 days earlier.
      - alert: OphisOpErpcNetworkFailsafeTimeouts
        expr: |
          sum(rate(erpc_network_failed_request_total{network="evm:10",error="ErrFailsafeTimeoutExceeded"}[10m])) > 0.02
        for: 10m
        labels:
          severity: critical
          chain: optimism
        annotations:
          summary: "OP eRPC network-level failsafe timeouts sustained ({{ $value | printf \"%.2f\" }}/s)"
          description: |
            Requests are exhausting the 12s network-level failsafe budget before
            any upstream returns. At this layer the failure is NOT attributed to an
            upstream, so per-upstream alerts stay silent — check routing priority
            and per-upstream health directly:
              curl -s localhost:9091/api/v1/query --data-urlencode \
                'query=erpc_upstream_block_head_lag'
              curl -s localhost:9091/api/v1/query --data-urlencode \
                'query=erpc_upstream_routing_priority'
            A lane whose head lag is enormous (or whose VM is gone) while it still
            holds priority 1 is the signature of the 2026-08-14 outage: eRPC has
            not scored it out, and its retry budget outlasts the network budget.
            Remedy: remove the lane from the rendered erpc.yaml and restart
            rpc-proxy (eRPC does NOT hot-reload).

      # ── Provider credential / quota death (2026-07-30 incident) ─────────────
      # WHY THESE EXIST: on 2026-07-30 every keyed RPC provider we held died of
      # quota or billing exhaustion — blockdaemon 429, Validation Cloud 401 "api
      # client is disabled", Alchemy "Monthly capacity limit exceeded", drpc 403
      # "monthly free request limit reached". They died ONE AT A TIME over days
      # and NOTHING paged, because every existing eRPC alert here keys off
      # CONSENSUS failure — which only trips once enough lanes are dead to break
      # quorum. By then the orderbook was already returning HTTP 500 on /quote.
      #
      # These two fire on the UPSTREAM, not the quorum, so they warn while the
      # quorum is still healthy and there is time to act.
      #
      # 2026-08-18: the selector gained ErrEndpointClientSideException, because
      # that is how eRPC labels a provider 401 (see the widening commit). That
      # broke the original justification for the bare `> 3` count — the two
      # ORIGINAL classes really are never-normal, but a generic 4xx bucket is
      # not, so a healthy high-traffic lane returning a handful of malformed or
      # unsupported requests could have paged CRITICAL with text telling the
      # operator to replace the provider. The rule therefore has two branches:
      # the ORIGINAL, definitive Unauthorized/BillingIssue classes keep their
      # count-only trigger, while the generic ClientSideException class must
      # clear both the count and 10% ratio gates. This preserves detection of a
      # credential or plan restriction that affects only some methods without
      # paging on a trickle of caller-caused generic 4xx responses. Measured for
      # calibration: across the full 15d retention window
      # ErrEndpointClientSideException appears ONLY on the dead lane (109,764 on
      # validationcloud, zero on publicnode and zan) — their errors land in
      # ExecutionException, RequestTimeout and TransportFailure instead.
      - alert: OphisOpErpcUpstreamCredentialFailing
        expr: |
          (
          sum by (upstream) (
            increase(erpc_upstream_request_errors_total{network="evm:10",error=~"ErrEndpointUnauthorized|ErrEndpointBillingIssue"}[30m])
          ) > 3
          or
          (
            (
              sum by (upstream) (
                increase(erpc_upstream_request_errors_total{network="evm:10",error="ErrEndpointClientSideException"}[30m])
              ) > 3
            )
            and
            (
              sum by (upstream) (
                rate(erpc_upstream_request_errors_total{network="evm:10",error="ErrEndpointClientSideException"}[30m])
              )
              /
              clamp_min(sum by (upstream) (rate(erpc_upstream_request_total{network="evm:10"}[30m])), 0.001)
              > 0.1
            )
          )
          )
          and
          sum by (upstream) (rate(erpc_upstream_request_total{network="evm:10"}[1h])) > 0.005
        for: 10m
        labels:
          severity: critical
          chain: optimism
        annotations:
          summary: "OP eRPC upstream {{ $labels.upstream }} has auth/billing or elevated generic 4xx errors"
          description: |
            In the last 30 minutes, `{{ $labels.upstream }}` returned more than
            three explicit auth/billing errors (ErrEndpointUnauthorized or
            ErrEndpointBillingIssue), OR more than three generic 4xx errors
            (ErrEndpointClientSideException) affecting over 10% of its requests.
            Explicit auth/billing errors are never normal and are intentionally
            not ratio-gated: a credential or plan restriction may affect only
            some methods. For the generic class, CONFIRM the cause from the error
            body before acting because malformed or unsupported requests are a
            caller bug rather than lane death.

            ⚠️ Do NOT grep the metrics for Unauthorized/BillingIssue and conclude
            nothing is wrong. eRPC classifies a provider 401 as
            ErrEndpointClientSideException, its generic 4xx bucket — which is
            exactly why this rule matched an empty vector through the whole
            2026-08-18 Validation Cloud outage until its selector was widened.
            Read the error label you actually have, rather than the one you
            expect:
              curl -s localhost:9091/api/v1/query --data-urlencode \
                'query=sum by (upstream,error) (rate(erpc_upstream_request_errors_total{network="evm:10"}[15m]))'

            This is the alert that was missing on 2026-07-30 and inert on
            2026-08-18. The quorum may still look healthy right now; it is one
            lane thinner than it appears and the remaining lanes are absorbing
            the load.

            Diagnose (the error body says which):
              docker logs optimism-mainnet-rpc-proxy-1 --tail 200 | grep -i "{{ $labels.upstream }}"
            Look for: "api client is disabled" (account disabled), "Monthly
            capacity limit exceeded" (plan quota), "usage limit for your current
            plan", 401/403.

            Act BEFORE the quorum breaks: renew/re-enable the provider, or swap
            the lane. Keep >=1 non-Cloudflare lane so the CDN-diversity invariant
            in configs/erpc.yaml.tmpl still holds. Verify a replacement with
            eth_getTransactionReceipt THROUGH the proxy, not just /quote — with
            agreementThreshold:2 a dead third lane hides behind the other two.

      - alert: OphisOpErpcUpstreamRateLimitedDead
        expr: |
          (
            sum by (upstream) (rate(erpc_upstream_request_errors_total{network="evm:10",error="ErrEndpointCapacityExceeded"}[15m]))
            /
            clamp_min(sum by (upstream) (rate(erpc_upstream_request_total{network="evm:10"}[15m])), 0.001)
          ) > 0.9
          and
          sum by (upstream) (rate(erpc_upstream_request_total{network="evm:10"}[1h])) > 0.005
        for: 30m
        labels:
          severity: warning
          chain: optimism
        annotations:
          summary: "OP eRPC upstream {{ $labels.upstream }} is >90% rate-limited for 30m (effectively dead)"
          description: |
            Over 90% of requests to `{{ $labels.upstream }}` have been rejected
            with ErrEndpointCapacityExceeded for 30 minutes. The lane is
            technically reachable but contributes nothing to consensus.

            Some capacity errors are NORMAL on free tiers, which is why this is
            a RATIO over a long window rather than a raw count — a lane that is
            merely busy will not trip it. ⚠️ The ratio is also why tenderly's
            chronic throttling (2026-08-09 incident: ~10-20 rejections/h idle,
            near-total rejection only during auction bursts) never tripped it —
            burst-correlated rejection dilutes below 90% over 30m. Do not treat
            this alert's silence as lane health.

            Measured precedent 2026-07-30: official-op and nodies-op both returned
            429 on 12/12 probes from this host, i.e. hard per-IP blocks, while the
            config still counted them as two of three lanes.

            Check whether the provider needs a key, a paid tier, or replacing.
            A self-hosted OP node removes this failure mode entirely.

      # ── Lane death, error-code-AGNOSTIC (2026-08-18 incident) ───────────────
      # WHY THIS EXISTS: the two rules above enumerate provider-specific error
      # codes, and on 2026-08-18 that is precisely why nothing paged. Validation
      # Cloud's monthly compute-unit allowance ran out, the key was disabled, and
      # every request came back HTTP 401 {"error":"api client is disabled"} — the
      # exact body OphisOpErpcUpstreamCredentialFailing quotes in its runbook.
      # But eRPC labels that ErrEndpointClientSideException, not
      # ErrEndpointUnauthorized, so that rule resolved to an EMPTY VECTOR against
      # ~7,600 qualifying errors per 30m. The lane was dead for 2h before the
      # warning-severity head-lag rule caught it as a side effect.
      #
      # This rule matches no error code at all. It asks only "is this lane
      # failing essentially everything we send it", which binds however the
      # provider phrases its refusal and however eRPC classifies it.
      #
      # ErrUpstreamBlockUnavailable is EXCLUDED from the numerator deliberately.
      # That error means eRPC declined to USE the lane for a block it does not
      # know the lane has yet (enforceHighestBlock pins each request to the
      # highest head across lanes); it is a routing decision, not a provider
      # failure. Counting it would make this rule track zan-op's chronic ~90%
      # short-circuit rate rather than actual lane death — a real but different
      # problem, which has its own rule below.
      #
      # Mutation-tested against live production data, 2026-08-18 13:xx CEST:
      #   validationcloud-op (dead)    ratio = 1.0003   -> FIRES
      #   zan-op             (healthy) ratio = 0.0005   -> silent
      #   publicnode-op      (healthy) ratio = 0.00016  -> silent
      # Three orders of magnitude of headroom, so 0.95 is not a knife edge.
      # alerts_test.yml replays both sides of that as a promtool unit test.
      - alert: OphisOpErpcUpstreamEffectivelyDead
        expr: |
          (
            sum by (upstream) (rate(erpc_upstream_request_errors_total{network="evm:10",error!="ErrUpstreamBlockUnavailable"}[15m]))
            /
            clamp_min(sum by (upstream) (rate(erpc_upstream_request_total{network="evm:10"}[15m])), 0.001)
          ) > 0.95
          and
          sum by (upstream) (rate(erpc_upstream_request_total{network="evm:10"}[1h])) > 0.005
        for: 10m
        labels:
          severity: critical
          chain: optimism
        annotations:
          summary: "OP eRPC upstream {{ $labels.upstream }} is failing ~everything"
          description: >-
            {{ $labels.upstream }} has failed over 95% of the requests eRPC sent it
            for 10 minutes, excluding block-availability short-circuits. Expired key,
            exhausted quota, revoked account or provider outage — the lane is
            contributing nothing to the quorum. With agreementThreshold:2 across 3
            lanes it hides behind the other two until a second lane blips, then
            everything fails closed at once. eRPC will NOT shed it on its own: the
            per-upstream circuit breaker does not open on 4xx, which it classifies as
            a client-side exception. Diagnose with docker logs
            optimism-mainnet-rpc-proxy-1 --tail 200, grepping the upstream id, then
            probe the provider directly for the raw HTTP status and body. Remedy:
            renew or replace the credential, or remove the lane from the rendered
            erpc.yaml and restart rpc-proxy (eRPC does not hot-reload). Keep at least
            one non-Cloudflare lane so the CDN-diversity invariant in
            configs/erpc.yaml.tmpl still holds, and verify any replacement with
            eth_getTransactionReceipt THROUGH the proxy, not just /quote.

      # ── Phantom quorum participant (found while triaging 2026-08-18) ────────
      # A lane can be reachable, keyed, healthy on eth_blockNumber and level with
      # the tip when probed by hand — and still answer almost nothing, because
      # eRPC short-circuits it with ErrUpstreamBlockUnavailable before the
      # request is ever sent. `enforceHighestBlock: true` pins every request to
      # the highest head KNOWN across lanes, and a lane's head is only as fresh
      # as its last state poll, so the lane whose cached head is oldest is judged
      # behind and skipped.
      #
      # Measured 2026-08-18: zan-op failed 173,448 of 191,733 requests (90%) this
      # way, matched to within 2 counts by erpc_upstream_stale_upper_bound_total
      # (173,446), while direct probing showed it 0-1 blocks behind publicnode.
      # It runs p50 1,076ms / p95 4,608ms against its own 4s timeout, so it loses
      # the freshness race on a 2s-block chain. Nominally the quorum was 2-of-3;
      # in practice one of the three answered a tenth of the time and no alert
      # could see it.
      #
      # NOTE: statePollerInterval was already 10s during a window when zan sat at
      # 6%, so the poll cadence alone does NOT explain this — do not "fix" it by
      # changing that knob without measuring first.
      #
      # EXPECTED TO FIRE FOR zan-op ON DEPLOY. That is the point: this has been
      # invisible. Silence it in Alertmanager if you want to defer the fix.
      - alert: OphisOpErpcUpstreamPhantomParticipant
        expr: |
          (
            sum by (upstream) (rate(erpc_upstream_request_errors_total{network="evm:10",error="ErrUpstreamBlockUnavailable"}[30m]))
            /
            clamp_min(sum by (upstream) (rate(erpc_upstream_request_total{network="evm:10"}[30m])), 0.001)
          ) > 0.6
          and
          sum by (upstream) (rate(erpc_upstream_request_total{network="evm:10"}[1h])) > 0.005
        for: 2h
        labels:
          severity: warning
          chain: optimism
        annotations:
          summary: "OP eRPC upstream {{ $labels.upstream }} is a phantom quorum participant"
          description: >-
            eRPC is refusing to send over 60% of requests to {{ $labels.upstream }}
            because it believes the lane's head is behind the block the request is
            pinned to. The lane counts toward the configured quorum size but is not
            actually answering, so the real agreement margin is thinner than
            maxParticipants suggests. Check whether this is a freshness artifact
            rather than a genuinely lagging node: compare
            erpc_upstream_latest_block_number across lanes and see whether
            erpc_upstream_stale_upper_bound_total tracks the error count one for one.
            If it does while a hand probe shows the lane at the tip, the lane is
            losing the state-poll freshness race, not lagging. This does not fail
            closed on its own; it quietly shrinks the number of lanes that can serve
            a method, so re-check the per-method quorum margin rule of thumb in
            configs/erpc.yaml.tmpl before assuming 2-of-3 still holds.

      # ── eRPC process restart (2026-08-17 silent panic) ──────────────────────
      # On 2026-08-17 13:24 CEST the proxy died with a Go runtime
      # "fatal error: concurrent map iteration and map write" inside
      # consensus.(*executor).trackAndPunishMisbehavingUpstreams and compose
      # restarted it. NOTHING paged: OphisOpERPCDown needs up{job="rpc-proxy"}==0
      # held for 3m against a 30s scrape, and a panic-restart is back long before
      # that — up never dropped once (2880/2880 samples over the next 24h).
      #
      # That crash is erpc/erpc issue #864, open since 2026-05-05 with its fix PR
      # #865 unmerged, and still unfixed on erpc main as of 2026-08-18, so
      # upgrading does not remove it. It only triggers on error paths, so it gets
      # MORE likely exactly when a lane is already dead: an incident amplifier.
      # Detection is the only lever we have.
      #
      # Uses freshness of process_start_time_seconds rather than changes() on it:
      # the exported value jitters by ~2s between scrapes, so changes() over 24h
      # reads 6 for a single real restart. A "started recently" window is immune.
      #
      # Fires on ANY restart, including a deliberate one during a lane swap. That
      # is intended — a restart nobody triggered is a crash.
      - alert: OphisOpErpcProxyRestarted
        expr: |
          time() - process_start_time_seconds{job="rpc-proxy"} < 300
        for: 0m
        labels:
          severity: warning
          chain: optimism
        annotations:
          summary: "OP eRPC proxy restarted in the last 5 minutes"
          description: >-
            The rpc-proxy process started less than 5 minutes ago. If you did not
            just restart it, it crashed and compose brought it back. Check for a
            panic with docker logs optimism-mainnet-rpc-proxy-1 --tail 400 grepping
            for "fatal error", "panic" or "goroutine", and read the container's
            RestartCount via docker inspect. A "concurrent map iteration and map
            write" trace in consensus.trackAndPunishMisbehavingUpstreams is
            erpc/erpc#864 and is triggered by an upstream already being unhealthy:
            treat it as a second symptom, not the root cause, and find the dead or
            disputing lane.

  - name: ophis-op-latency
    interval: 30s
    rules:
      - alert: OphisOpAuctionLatencyHigh
        # 2026-08-09: renamed to driver_auction_preprocessing_bucket (verified live).
        expr: |
          histogram_quantile(0.95, rate(driver_auction_preprocessing_bucket[10m])) > 5
        for: 10m
        labels:
          severity: warning
          chain: optimism
        annotations:
          summary: "OP p95 auction-preprocessing > 5s"
          description: "Auction preprocessing p95 above 5s for 10m. RPC reads (block fetch, balance reads) are slowing the auction loop. Likely RPC provider degradation — inspect eRPC proxy metrics for consensus failures."

      - alert: OphisOpSolveTimeBudgetExhausted
        # 2026-08-09: renamed to driver_remaining_solve_time_bucket; the kind
        # label values are {"auction","quote"} (verified in TSDB) — "dispatched"
        # does not exist. Auction solve budget is what this alert is about.
        expr: |
          histogram_quantile(0.99, rate(driver_remaining_solve_time_bucket{kind="auction"}[10m])) < 1.0
        for: 10m
        labels:
          severity: warning
          chain: optimism
        annotations:
          summary: "OP solvers receiving under 1s of solve-time budget at p99"
          description: "By the time solvers are dispatched, less than 1s remains on the 20s solve-deadline at p99. Upstream RPC + preprocessing is eating the budget. Solvers will quote stale or skip auctions."

  - name: ophis-op-chain-health
    interval: 30s
    rules:
      # Audit MEDIUM-9 (2026-05-17): submission-deadline=60 in autopilot.toml
      # was tuned for OP's ~2s post-Bedrock block time. If OP ever bumps to 2s
      # (testnet has done this before) or drops to 500ms (rumored
      # optimization), 60 blocks becomes either too long (stale-quote/MEV
      # window) or too short (mass settle timeouts). Detect block-time
      # drift via the rate of advance of `last_block_number` — the Gauge
      # exported by apps/backend/crates/ethrpc/src/block_stream.rs:329.
      # `rate()` on a monotonic Gauge yields blocks/sec (≈ 1.0 on OP today).
      - alert: OphisOpBlockTimeDrift
        # 2026-08-09: renamed to gp_v2_autopilot_last_block_number (verified
        # live: rate ~= 0.5/s on OP's 2s blocks, inside the 0.4-0.7 band).
        expr: |
          (
            rate(gp_v2_autopilot_last_block_number{job="autopilot"}[5m]) < 0.4
            or
            rate(gp_v2_autopilot_last_block_number{job="autopilot"}[5m]) > 0.7
          )
        for: 15m
        labels:
          severity: warning
          chain: optimism
        annotations:
          summary: "OP effective block time drifted >25% from assumed 1s"
          description: "OP block production rate is outside the 0.4-0.7 blocks/sec band (OP ~2s post-Bedrock) for 15min. submission-deadline=60 in autopilot.toml is now mistuned (either too long → stale quote / MEV window, or too short → mass settle timeouts). Recompute 60 × actual-block-time and update config."

      # Audit MEDIUM-5 paired alert: gas-price-cap was tightened 1000 → 5 gwei (PR #131).
      # Alert if OP basefee approaches the cap. Metric source: roadmap 1.6 /
      # task #142 — autopilot/src/maintenance.rs emits `eth_basefee_wei` per
      # observed block (Prom name: autopilot_maintenance_eth_basefee_wei).
      # Threshold: 1.5 gwei = 30 % of the 5 gwei cap set in #131. OP steady-state basefee is ~0.01 gwei so this fires only on genuine surges (e.g. an OP outage backlog clearing).
      - alert: OphisOpBasefeeApproachingCap
        # `chain="optimism"` selector is defense-in-depth against future
        # federated Prom (or someone copy-pasting this rule into the OP/
        # MegaETH alerts.yml). The chain label is set via prometheus.yml's
        # `external_labels: chain: optimism` so each chain's Prom only
        # emits its own series — but pinning here means the rule wouldn't
        # misfire on cross-chain series if the tenancy ever changes.
        # 2026-08-09: renamed to the registered gp_v2_autopilot_ name and DROPPED
        # the {chain="optimism"} matcher — these series carry only instance/job
        # labels (verified in TSDB); the chain filter silently matched nothing.
        expr: |
          gp_v2_autopilot_autopilot_maintenance_eth_basefee_wei > 1500000000
        for: 5m
        labels:
          severity: warning
          chain: optimism
        annotations:
          summary: "OP basefee at {{ $value | humanize }}wei sustained >5min — approaching 5 gwei gas_price_cap"
          description: "Optimism basefee has exceeded 1.5 gwei for 5 consecutive minutes. The driver's gas_price_cap is 5 gwei (per #131). At ~3× headroom remaining a sustained spike risks settlement-broadcast rejection. Inspect: `cast basefee --rpc-url https://optimism-rpc.publicnode.com`. Consider raising gas_price_cap or pausing solver if congestion sustained."

      # Phase 4 audit F2 + sharp-edges audit F3 (2026-05-21): the driver
      # re-checks gas_price_cap on both submit and cancel paths AFTER RBF
      # bump + solver-override. Behaviour differs by context:
      #
      #   context="submit_settlement"  → driver ABORTS the broadcast (fail-closed).
      #                                  Settle tx is 200-400k gas; drain is
      #                                  significant; safer to fail loud.
      #   context="cancel_settlement"  → driver LOGS + BROADCASTS ANYWAY.
      #                                  Cancellation is 21k gas (bounded
      #                                  ~$0.05 drain even at 1000 gwei) and
      #                                  aborting would leave the original
      #                                  settle tx stuck in-flight, blocking
      #                                  the submitter EOA nonce for hours.
      #
      # Either way this counter increments and the alert fires — operator
      # must investigate. Non-zero rate is anomalous regardless of context.
      - alert: OphisOpGasPriceCapExceeded
        # 2026-08-09: DROPPED the {chain="optimism"} matcher — driver metrics
        # carry no chain label (verified on driver_settlements/driver_solutions),
        # so the filter guaranteed an empty match.
        #
        # 2026-08-09 (codex rounds 2-5): every samples-only PromQL form over a
        # LAZY CounterVec proved unfixable — increase() misses the single-
        # sample birth, appearance arms either false-page on scrape-gap
        # recovery or miss bursts (first scraped value != birth value), and a
        # change detector misses a restart-reborn child landing on its exact
        # pre-restart value. Round 5 closed the gap AT THE PRODUCER:
        # Mempools::try_new pre-creates every (mempool, context) child at 0
        # (observe::init_mempool_metric_children, registry-asserted by a
        # driver unit test), so from the first scrape every violation is a
        # real observed transition and plain increase() is correct by
        # construction. Deployed together with that driver build — this
        # expression is only sound on drivers that pre-initialize.
        #
        # Round 6/7 (boot-window analysis, corrected): a violation BETWEEN
        # driver start and the first scrape is caught on a restart with
        # downtime < 5m — the previous process's pre-initialized samples sit
        # in the window and increase() is reset-aware (5,5 -> 1 counts +1;
        # 0,0 -> 1 counts +1). Round 7: for downtime > 5m those samples age
        # OUT of the window and a flat post-outage series shows no increase —
        # the second arm (round-4 change detector, 7d lookback) bridges any
        # realistic outage by comparing against the last known value.
        # Verified deployed 2026-08-09: 6 gas-cap + 18 submission children
        # present at 0 in the TSDB before any event.
        # Round 8/9: the change-detector arm is `(value != last-known) AND
        # (value > 0)`. Under pre-init (#1151) a reborn child starts at 0 by
        # INITIALIZATION, so a bare `!=` false-paged ~5m on every routine
        # restart after any historical nonzero (round 8); a bare `>` avoided
        # that but missed post-reset counts BELOW the historical value
        # (old 5 -> reborn 1). The nonzero gate silences initialized zeroes
        # while any positive value differing from history pages (round 9).
        # This arm also covers a brand-new stack's first-ever violation
        # before its first scrape: no history -> label-matched 0 -> N != 0
        # AND N > 0 fires.
        # Round 10: the driver now registers ProcessCollector, so the
        # young-process arm closes residual (c): within 5m of driver start,
        # ANY positive count proves a violation since start (pre-init
        # guarantees children begin at 0 in-process), regardless of what the
        # pre-outage history held — the exact-value-rebirth blind spot is
        # gone. Routine restarts stay silent (children scrape at 0, the
        # `> 0` filter fails).
        # Remaining residual — needs NO usable samples at all:
        #  (b) Prometheus outage longer than the lookback coinciding with
        #      the event — monitoring-of-monitoring concern.
        expr: |
          (increase(driver_gas_price_cap_exceeded[5m]) > 0)
          or ((driver_gas_price_cap_exceeded != (last_over_time(driver_gas_price_cap_exceeded[7d] offset 5m) or (driver_gas_price_cap_exceeded * 0))) and (driver_gas_price_cap_exceeded > 0))
          or ((driver_gas_price_cap_exceeded > 0) and on() ((time() - driver_process_start_time_seconds{job="driver"}) < 300))
        for: 0m
        labels:
          severity: critical
          chain: optimism
        annotations:
          summary: "OP driver gas_price_cap policy violated (context={{ $labels.context }}, mempool={{ $labels.mempool }})"
          description: "The driver computed a final gas price > 5 gwei policy cap after RBF/solver-override. If context='submit_settlement' the broadcast was ABORTED (settle tx is not on-chain); if context='cancel_settlement' the broadcast PROCEEDED anyway to avoid nonce-stuck (cancellation is 21k gas — bounded drain). Possible causes: (1) hostile/misconfigured upstream returning a fake eth_gasPrice spike; (2) genuine OP fee surge while a solver-override pushed past the cap; (3) repeated RBF bumps cascading above policy. Inspect driver logs near the alert window for `gas price ... exceeds configured cap`. Cross-check basefee with `cast basefee --rpc-url https://optimism-rpc.publicnode.com`. If the surge is real, decide whether to raise gas_price_cap (config edit + render + recreate driver) or pause solving until congestion abates."

  # ── ophis-op-ethflow group REMOVED while its only rule is disabled ──
  # (2026-08-09 codex round 2). A group whose `rules:` key parses to null is
