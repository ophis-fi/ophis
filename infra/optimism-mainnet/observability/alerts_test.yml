          technically reachable but contributes nothing to consensus.


          Some capacity errors are NORMAL on free tiers, which is why this is

          a RATIO over a long window rather than a raw count — a lane that is

          merely busy will not trip it. ⚠️ The ratio is also why tenderly''s

          chronic throttling (2026-08-09 incident: ~10-20 rejections/h idle,

          near-total rejection only during auction bursts) never tripped it —

          burst-correlated rejection dilutes below 90% over 30m. Do not treat

          this alert''s silence as lane health.


          Measured precedent 2026-07-30: official-op and nodies-op both returned

          429 on 12/12 probes from this host, i.e. hard per-IP blocks, while the

          config still counted them as two of three lanes.


          Check whether the provider needs a key, a paid tier, or replacing.

          A self-hosted OP node removes this failure mode entirely.

