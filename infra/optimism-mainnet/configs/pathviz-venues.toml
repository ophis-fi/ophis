# pathviz venue registry -- Optimism mainnet (chain 10).
#
# Maps on-chain settlement counterparties to human labels for the pathviz
# venue column. Seeded from the driver custom allowlist
# (`custom_allowlist::OPTIMISM_MAINNET`), which is the set of aggregator
# routers Ophis settles through. Any counterparty NOT listed here degrades
# to its bare 0x address in the diagram -- the renderer never fabricates a
# label (owner decision 27).
#
# OWNERSHIP: infra ops. When a new aggregator router or a directly-integrated
# AMM/PMM is added to the driver allowlist, add the matching label here in
# the same change so user-facing images stay legible. Addresses are
# EIP-55-checksummed and matched case-insensitively at load.

[venues]
