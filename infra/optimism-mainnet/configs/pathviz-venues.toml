# pathviz venue registry -- Optimism mainnet (chain 10).
#
# The route column is an ALLOWLIST: a settlement counterparty is drawn ONLY if
# it is a [venues] entry below. Everything else -- known aggregator routers,
# downstream pools an aggregator internally hops through, unknown addresses --
# is never drawn. This fails closed: a missing, stale, or malformed registry
# draws nothing rather than leaking a competitor.
#
#   [venues]  real liquidity venues (AMM/PMM pools) Ophis settles into. Drawn
#             as route hops and labelled. If it is not listed here, it is not
#             drawn.
#
#   [routers] aggregator routers Ophis solvers call. Ophis routes THROUGH them,
#             but they are competitors, and the standing copy rule is that Ophis
#             public copy never names one (the frontend enforces the same rule
#             for solver names via the display-alias layer). They are excluded by
#             the allowlist anyway (they are not [venues]); listing them here is
#             documentation AND a guardrail -- an address may not appear in both
#             tables, so the loader REJECTS a config that promotes a known
#             competitor to a drawn venue.
#
# On Optimism, Ophis settles EXCLUSIVELY through aggregator routers (the driver
# custom allowlist `custom_allowlist::OPTIMISM_MAINNET`), so [venues] is empty:
# the route column stays empty and each graph degrades to solver -> out (surplus
# and the winning Ophis solver still render). Add direct-pool venues under
# [venues] as they are integrated.
#
# OWNERSHIP: infra ops. When a new counterparty is added to the driver allowlist,
# add it here in the same change (as a [venues] pool or a [routers] aggregator)
# so user-facing images stay legible and rule-compliant. Addresses are
# EIP-55-checksummed and matched case-insensitively at load.

[venues]
# (No direct-pool venues on Optimism yet: all settlement flows through the
# aggregator routers listed under [routers].)

