# pathviz venue registry -- Optimism mainnet (chain 10).
#
# Classifies on-chain settlement counterparties for the pathviz route column.
#
#   [venues]  real liquidity venues (AMM/PMM pools) Ophis settles into. Drawn
#             as route hops and labelled. A [venues] address with no label
#             degrades to its bare 0x address -- the renderer never fabricates
#             one (owner decision 27).
#
#   [routers] aggregator routers Ophis solvers call. Ophis routes THROUGH them,
#             but they are competitors, and the standing copy rule is that Ophis
#             public copy never names a competitor (the frontend enforces the
#             same rule for solver names via the display-alias layer). Recorded
#             here so the backend drops them from the route column: a router
#             counterparty is a settlement pass-through, not a drawn hop.
#
# On Optimism, Ophis settles EXCLUSIVELY through aggregator routers (the driver
# custom allowlist `custom_allowlist::OPTIMISM_MAINNET`), so every counterparty
# below is a router and [venues] is empty: the route column stays empty and each
# graph degrades to solver -> out (surplus and the winning Ophis solver still
# render). Add direct-pool venues under [venues] as they are integrated.
#
# OWNERSHIP: infra ops. When a new counterparty is added to the driver allowlist,
# add it here in the same change (as a [venues] pool or a [routers] aggregator)
# so user-facing images stay legible and rule-compliant. Addresses are
# EIP-55-checksummed and matched case-insensitively at load.

[venues]
# (No direct-pool venues on Optimism yet: all settlement flows through the
# aggregator routers listed under [routers].)

