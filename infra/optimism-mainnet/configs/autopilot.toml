[fee-policies]
max-partner-fee = 0.01

# Ophis-operated-chain economics: retain 80% of execution improvement over the
# reference quote, capped at 30 bps of volume. The autopilot substitutes the
# stablecoin policy (50%, capped at 10 bps) when both tokens are recognized OP
# stablecoins. The signed appData partner fee supplies the separate 1 bp base.
[[fee-policies.policies]]
kind.price-improvement = { factor = 0.80, max-volume-factor = 0.003 }
order-class = "market"

# Partner-fee recipient registry (partner-fees Phase A). `registration-enabled`
# is the MASTER ENABLE for the whole feature and the autopilot honors it exactly
# as the orderbook does: while off it uses the Ophis-only policy and drops ALL
# third-party partner fees at settlement. It MUST be set identically here and in
# the orderbook config: enabling it only in orderbook.toml means partner fees
# pass ingress but are silently dropped at settlement (registered partners earn
# nothing). Flip both on together, only after the internal test partner order
# settles; `refresh-interval` sets how quickly a registration or suspension
# takes effect here.
[partner-fee-registry]
registration-enabled = false
refresh-interval = "30s"

[database]
write-url = "%DB_WRITE_URL"
read-url = "%DB_READ_URL"

