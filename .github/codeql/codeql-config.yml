name: 'Ophis CodeQL config'

paths-ignore:
  # Vendored upstream subtrees — each has its own CI in the upstream repo.
  # NOTE: contracts/ is not purely vendored. Ophis-authored, mainnet-live
  # Solidity lives at contracts/src/contracts/vault/ (OphisVaultPolicyModule,
  # OphisVaultPolicyModuleFactory, OphisChainlinkFloor — deployed on 6 chains).
  # CodeQL ships no Solidity extractor, so that code is covered by Slither
  # (scripts/slither-baseline.py) and Echidna (.github/workflows/echidna.yml),
  # not by this config.
  - 'apps/backend/'
  - 'contracts/'
  # Generated / build artifacts.
  - '**/node_modules/'
  - '**/dist/'
  - '**/build/'
  - '**/target/'
  - '**/out/'
  - '**/.next/'
  # Test fixtures + mocks (low signal, high noise).
  - '**/__fixtures__/'
  - '**/__mocks__/'
  - '**/test/fixtures/'
