name: OTC Milestone C merge gate

# Bootstrap invariant: do not add this workflow's required-check context to the
# main ruleset until the commit introducing this file and its trusted parser is
# merged. The rollout procedure verifies that absence before bootstrap merge.

on:
  # The workflow definition itself comes from the protected base branch. It
  # never checks out or executes PR-head code.
  # The required-check ruleset uses strict base freshness. A base advance makes
  # the PR unmergeable until its branch is updated; that update emits synchronize
  # and reruns this gate against the new full base SHA.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # Deliberately no pull_request_review(_comment) triggers: those use PR-controlled
  # workflow YAML. A trusted exact request makes the gate red before Codex
  # reviews; only an authenticated clean issue comment can make it green again.
  issue_comment:
    types: [created, edited, deleted]

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  # All events that can change accepted evidence share one PR-head lane.
  # Metadata edits and untrusted issue comments get isolated lanes so they
  # cannot cancel an evidence evaluation.
  group: >-
    otc-codex-gate-${{ github.event.pull_request.number || github.event.issue.number }}-${{
    github.event_name == 'pull_request_target' &&
    github.event.action == 'edited' && github.event.changes.base == null &&
    format('ignored-{0}', github.run_id) || github.event_name == 'issue_comment' &&
    github.event.comment.user.login != 'chatgpt-codex-connector[bot]' &&
    !(github.event.action != 'created' &&
    github.event.comment.user.login == 'github-actions[bot]' &&
    (startsWith(github.event.comment.body, 'OTC Codex gate invalidated.') ||
    startsWith(github.event.changes.body.from, 'OTC Codex gate invalidated.'))) &&
    !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
    github.event.comment.id || 'authoritative' }}
  cancel-in-progress: true

jobs:
  rerun-on-comment:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' ||
      (github.event.action != 'created' &&
      github.event.comment.user.login == 'github-actions[bot]' &&
      (startsWith(github.event.comment.body, 'OTC Codex gate invalidated.') ||
      startsWith(github.event.changes.body.from, 'OTC Codex gate invalidated.'))) ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    name: Re-evaluate PR-head gate after conversation change
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: write
      checks: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      # issue_comment workflows run on the trusted default branch, not the PR
      # head. Rerun the newest gate already attached to the live PR head so the
      # required context becomes pending immediately and cannot stay stale-green.
      - name: Rerun the current PR-head gate
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONS_LOGIN: github-actions[bot]
          CODEX_LOGIN: chatgpt-codex-connector[bot]
          CLEAN_PREFIX: "Codex Review: Didn't find any major issues. :+1:"
          GATE_JOB_NAME: OTC Milestone C / fresh Codex review
          COMMENT_ACTION: ${{ github.event.action }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_BODY_FROM: ${{ github.event.changes.body.from }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo 'Invalid GitHub repository' >&2
            exit 1
          }
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo 'Invalid pull request number' >&2
            exit 1
          }
          [[ "$COMMENT_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo 'Invalid issue comment number' >&2
            exit 1
          }
          pull_state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          head_sha="$(jq -r '.head.sha' <<<"$pull_state")"
          base_sha="$(jq -r '.base.sha' <<<"$pull_state")"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Invalid current pull request head' >&2
            exit 1
          }
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Invalid current pull request base' >&2
            exit 1
          }

          was_request=false
          current_request=false
          was_clean=false
          current_clean=false
          was_marker=false
          current_marker=false
          normalized_body="$(
            jq -Rrs 'gsub("\r\n"; "\n") | gsub("^\\s+|\\s+$"; "")' <<<"$COMMENT_BODY"
          )"
          normalized_body_from="$(
            jq -Rrs 'gsub("\r\n"; "\n") | gsub("^\\s+|\\s+$"; "")' \
              <<<"$COMMENT_BODY_FROM"
          )"
          expected_request="@codex review

          Head: $head_sha
          Base: $base_sha"
          expected_marker_prefix="OTC Codex gate invalidated.

          Head: $head_sha
          Base: $base_sha
          Source comment: "
          short_head="${head_sha:0:10}"
          [[ "$normalized_body" == "$expected_request" ]] && current_request=true
          [[ "$normalized_body_from" == "$expected_request" ]] && was_request=true
          if [[ "$COMMENT_BODY" == "$CLEAN_PREFIX"* ]] && {
            [[ "$COMMENT_BODY" == *"**Reviewed commit:** \`$short_head\`"* ]] ||
              [[ "$COMMENT_BODY" == *"**Reviewed commit:** \`$head_sha\`"* ]]
          }; then
            current_clean=true
          fi
          if [[ "$COMMENT_BODY_FROM" == "$CLEAN_PREFIX"* ]] && {
            [[ "$COMMENT_BODY_FROM" == *"**Reviewed commit:** \`$short_head\`"* ]] ||
              [[ "$COMMENT_BODY_FROM" == *"**Reviewed commit:** \`$head_sha\`"* ]]
          }; then
            was_clean=true
          fi
          [[ "$COMMENT_BODY" == "$expected_marker_prefix"* ]] && current_marker=true
          [[ "$COMMENT_BODY_FROM" == "$expected_marker_prefix"* ]] && was_marker=true
          if [[ "$COMMENT_ACTION" == 'deleted' ]]; then
            was_request="$current_request"
            was_clean="$current_clean"
            was_marker="$current_marker"
            current_request=false
            current_clean=false
            current_marker=false
          fi
          if [[ "$COMMENT_ACTION" != 'created' ]] && {
            [[ "$COMMENT_USER" == "$CODEX_LOGIN" && "$was_clean" == true ]] ||
              [[ "$COMMENT_USER" == "$ACTIONS_LOGIN" && "$was_marker" == true ]] ||
              [[ "$COMMENT_USER" != "$CODEX_LOGIN" && "$was_request" == true && "$current_request" != true ]]
          }; then
            marker="OTC Codex gate invalidated.

          Head: $head_sha
          Base: $base_sha
          Source comment: $COMMENT_ID"
            gh api --silent --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$marker"
          fi
          details_url="$(
            gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json statusCheckRollup \
              | jq -r --arg name "$GATE_JOB_NAME" \
                '[.statusCheckRollup[] | select(.name == $name and .detailsUrl != null)] |
                sort_by(.startedAt) | reverse | .[0].detailsUrl // empty'
          )"
          expected_prefix="https://github.com/$GITHUB_REPOSITORY/actions/runs/"
          [[ "$details_url" == "$expected_prefix"* ]] || {
            echo 'No exact required gate check is attached to the current head' >&2
            exit 1
          }
          run_path="${details_url#"$expected_prefix"}"
          [[ "$run_path" =~ ^([1-9][0-9]*)/job/[1-9][0-9]*$ ]] || {
            echo 'Invalid required gate check details URL' >&2
            exit 1
          }
          run_id="${BASH_REMATCH[1]}"
          rerun_gate() {
            local attempt error
            for attempt in {1..60}; do
              if error="$(gh api --silent --method POST \
                "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/rerun" 2>&1)"; then
                return 0
              fi
              if [[ "$error" == *'HTTP 409'* ]]; then
                echo 'The current PR-head gate is busy; waiting to enqueue a fresh evaluation.'
                sleep 10
                continue
              fi
              echo "$error" >&2
              return 1
            done
            echo 'Timed out waiting to enqueue a fresh PR-head gate evaluation.' >&2
            return 1
          }

          rerun_gate

  codex-review:
    if: >-
      github.event_name != 'issue_comment' &&
      (github.event_name != 'pull_request_target' || github.event.action != 'edited' ||
      github.event.changes.base != null)
    name: >-
      ${{ (github.event_name == 'pull_request_target' && github.event.action == 'edited' &&
      github.event.changes.base == null) && 'OTC Milestone C / metadata edit ignored' ||
      'OTC Milestone C / fresh Codex review' }}
    runs-on: ubuntu-latest
    steps:
      # Run the gate implementation from the trusted base commit. Otherwise a
      # money-path PR could edit this script to approve itself.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Locate the trusted gate implementation
        id: trusted-gate
        shell: bash
        run: |
          if [[ -f scripts/require-otc-codex-review.mjs ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Bootstrap PR: the trusted base does not contain the gate yet.'
          fi
      - name: Mutation-test the review evidence parser
        if: steps.trusted-gate.outputs.available == 'true'
        run: node scripts/require-otc-codex-review.mjs --self-test
      - name: Require clean Codex evidence for the current money-path head
        if: steps.trusted-gate.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: node scripts/require-otc-codex-review.mjs
