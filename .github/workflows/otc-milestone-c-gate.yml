name: OTC Milestone C merge gate

# Bootstrap invariant: do not add this workflow's required-check context to the
# main ruleset until the commit introducing this file and its trusted parser is
# merged. The rollout procedure verifies that absence before bootstrap merge.

on:
  # The workflow definition itself comes from the protected base branch. It
  # never checks out or executes PR-head code.
  # The required-check ruleset uses strict base freshness. A base advance makes
  # the PR unmergeable until its branch is updated; that update emits synchronize
  # and reruns this gate against the new full base SHA.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: otc-codex-gate-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}-${{ github.event.comment.id || 'pr' }}
  cancel-in-progress: true

jobs:
  rerun-on-comment:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    name: Re-evaluate PR-head gate after conversation change
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      # issue_comment workflows run on the trusted default branch, not the PR
      # head. Rerun the newest gate already attached to the live PR head so the
      # required context becomes pending immediately and cannot stay stale-green.
      - name: Rerun the current PR-head gate
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_LOGIN: chatgpt-codex-connector[bot]
          CLEAN_PREFIX: "Codex Review: Didn't find any major issues. :+1:"
          COMMENT_ACTION: ${{ github.event.action }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_UPDATED_AT: ${{ github.event.comment.updated_at }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo 'Invalid GitHub repository' >&2
            exit 1
          }
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo 'Invalid pull request number' >&2
            exit 1
          }
          [[ "$COMMENT_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo 'Invalid issue comment number' >&2
            exit 1
          }
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Invalid current pull request head' >&2
            exit 1
          }
          run_id="$(
            gh api --method GET --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/workflows/otc-milestone-c-gate.yml/runs" \
              -f per_page=100 \
              | jq -r --argjson number "$PR_NUMBER" --arg head "$head_sha" \
                '[.[].workflow_runs[] | select(any(.pull_requests[]; .number == $number and .head.sha == $head))][0].id // empty'
          )"
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || {
            echo 'No gate run is attached to the current pull request head' >&2
            exit 1
          }
          rerun_gate() {
            local error
            if ! error="$(gh api --silent --method POST \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/rerun" 2>&1)"; then
              if [[ "$error" == *'HTTP 409'* ]]; then
                echo 'The current PR-head gate is already queued or running.'
                return 0
              fi
              echo "$error" >&2
              return 1
            fi
          }

          rerun_gate
          if [[ "$COMMENT_ACTION" == 'deleted' || "$COMMENT_BODY" != @codex\ review* ]]; then
            exit 0
          fi

          # GitHub Actions has no reaction trigger. Keep this trusted request
          # worker alive long enough to observe the connector's reaction-only
          # clean path, then rerun the same check attached to the PR head.
          for _attempt in {1..48}; do
            if gh api \
              "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions?per_page=100" \
              | jq -e --arg login "$CODEX_LOGIN" --arg updated "$COMMENT_UPDATED_AT" \
                'any(.[]; .user.login == $login and .content == "+1" and .created_at > $updated)' \
                >/dev/null; then
              echo 'Fresh Codex reaction observed; rerunning the PR-head gate.'
              rerun_gate
              exit 0
            fi
            if gh api --method GET "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f per_page=100 \
              -f since="$COMMENT_UPDATED_AT" \
              | jq -e --arg login "$CODEX_LOGIN" --arg updated "$COMMENT_UPDATED_AT" \
                --arg short_head "${head_sha:0:10}" \
                --arg clean_prefix "$CLEAN_PREFIX" \
                'any(.[]; .user.login == $login and .created_at > $updated and
                  (.body | startswith($clean_prefix)) and
                  (.body | contains("**Reviewed commit:** `" + $short_head + "`")))' \
                >/dev/null; then
              echo 'Clean Codex comment observed; rerunning the PR-head gate.'
              rerun_gate
              exit 0
            fi
            sleep 15
          done
          echo 'No clean reaction or comment appeared before the bounded poll deadline.'

  codex-review:
    if: github.event_name != 'issue_comment'
    name: OTC Milestone C / fresh Codex review
    runs-on: ubuntu-latest
    steps:
      # Run the gate implementation from the trusted base commit. Otherwise a
      # money-path PR could edit this script to approve itself.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Locate the trusted gate implementation
        id: trusted-gate
        shell: bash
        run: |
          if [[ -f scripts/require-otc-codex-review.mjs ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Bootstrap PR: the trusted base does not contain the gate yet.'
          fi
      - name: Mutation-test the review evidence parser
        if: steps.trusted-gate.outputs.available == 'true'
        run: node scripts/require-otc-codex-review.mjs --self-test
      - name: Require clean Codex evidence for the current money-path head
        if: steps.trusted-gate.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: node scripts/require-otc-codex-review.mjs
