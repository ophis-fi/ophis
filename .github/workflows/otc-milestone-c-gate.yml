name: OTC Milestone C merge gate

# Bootstrap invariant: do not enforce this file until the commit introducing it
# and its trusted parser is merged. After bootstrap, an organization ruleset
# must require this workflow from ophis-fi/ophis, this path, and refs/heads/main.
# Do not rely on the job-name status context: PR-controlled workflows can emit
# duplicate check names. The protect-main ruleset must also require review-thread
# resolution; a review with findings emits no clean result, and native thread
# enforcement closes later inline-comment lifecycle races.

on:
  # pull_request_target loads this definition from the protected base. Required
  # workflow rules also resolve this path from the protected source ref.
  # Strict base freshness makes a base advance unmergeable until synchronize
  # reruns this gate against the new full base SHA.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request to evaluate from the protected default branch
        required: true
        type: string
      lock_comment_id:
        description: Newest native gate-lock review comment this run may resolve
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: write

jobs:
  codex-review:
    if: >-
      github.event.action != 'edited' || github.event.changes.base != null
    name: OTC Milestone C / fresh Codex review
    runs-on: ubuntu-latest
    steps:
      # Run the gate implementation from the trusted base commit. Otherwise a
      # money-path PR could edit this script to approve itself.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Locate the trusted gate implementation
        id: trusted-gate
        shell: bash
        run: |
          if [[ -f scripts/require-otc-codex-review.mjs ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Bootstrap PR: the trusted base does not contain the gate yet.'
          fi
      - name: Mutation-test the review evidence parser
        if: steps.trusted-gate.outputs.available == 'true'
        run: node scripts/require-otc-codex-review.mjs --self-test
      - name: Require clean Codex evidence for the current money-path head
        if: steps.trusted-gate.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: >-
            ${{ github.event.pull_request.number || inputs.pull_request_number }}
        run: node scripts/require-otc-codex-review.mjs
      - name: Resolve superseded native gate locks
        if: github.event_name == 'workflow_dispatch' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          LOCK_COMMENT_ID: ${{ inputs.lock_comment_id }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        shell: bash
        run: |
          [[ "$GITHUB_REPOSITORY" =~ ^([A-Za-z0-9_.-]+)/([A-Za-z0-9_.-]+)$ ]] || {
            echo 'Invalid GitHub repository' >&2
            exit 1
          }
          owner="${BASH_REMATCH[1]}"
          name="${BASH_REMATCH[2]}"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo 'Invalid pull request number' >&2
            exit 1
          }
          [[ "$LOCK_COMMENT_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo 'Invalid native gate-lock comment number' >&2
            exit 1
          }
          cursor=null
          while :; do
            response="$(
              gh api graphql -F owner="$owner" -F name="$name" \
                -F number="$PR_NUMBER" -F cursor="$cursor" \
                -f query='query($owner:String!,$name:String!,$number:Int!,$cursor:String){
                  repository(owner:$owner,name:$name){pullRequest(number:$number){
                    reviewThreads(first:100,after:$cursor){
                      nodes{id isResolved comments(first:20){
                        nodes{databaseId body author{login}}
                      }}
                      pageInfo{hasNextPage endCursor}
                    }
                  }}
                }'
            )"
            mapfile -t thread_ids < <(
              jq -r --argjson cutoff "$LOCK_COMMENT_ID" '
                .data.repository.pullRequest.reviewThreads.nodes[] |
                select(.isResolved == false) |
                select(any(.comments.nodes[];
                  ((.author.login == "github-actions" or
                    .author.login == "github-actions[bot]") and
                  .databaseId <= $cutoff and
                  (.body | startswith("OTC Codex gate pending.\n\nHead: "))))) |
                .id
              ' <<<"$response"
            )
            for thread_id in "${thread_ids[@]}"; do
              gh api graphql -F thread="$thread_id" \
                -f query='mutation($thread:ID!){
                  resolveReviewThread(input:{threadId:$thread}){thread{id isResolved}}
                }' >/dev/null
            done
            has_next="$(
              jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' \
                <<<"$response"
            )"
            [[ "$has_next" == true ]] || break
            cursor="$(
              jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor // empty' \
                <<<"$response"
            )"
            [[ -n "$cursor" ]] || {
              echo 'Missing review-thread pagination cursor' >&2
              exit 1
            }
          done
