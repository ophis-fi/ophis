name: Deploy status page (status.ophis.fi)

# Typecheck + unit tests + a dry-run bundle on PRs; the same, then `wrangler deploy`, on push to main.
#
# Uses CLOUDFLARE_WORKERS_TOKEN (Workers Scripts: Edit + Workers Routes: Edit, as mcp-deploy.yml).
# The Worker stores its state in a Durable Object, so there is no D1 migration to apply by hand.
# The first run creates the Durable Object, the Cron Trigger and the custom domain status.ophis.fi;
# later runs re-assert them (apps/status/README.md, "After the first deploy").
#
# apps/status has no dependency of its own. It is deployed with the root lockfile's pinned
# wrangler, reached through @ophis/mcp-server, never a floating npx tag next to the token.
# ponytail: borrowed wrangler; give apps/status its own package.json when it needs a dependency.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'apps/status/**'
      - 'tests/functions/status.test.ts'
      - 'functions/tsconfig.json'
      - '.github/workflows/status-deploy.yml'
  pull_request:
    paths:
      - 'apps/status/**'
      - 'tests/functions/status.test.ts'
      - 'functions/tsconfig.json'
      - '.github/workflows/status-deploy.yml'

permissions:
  contents: read

concurrency:
  group: status-deploy-${{ github.ref }}
  # Let an in-flight production deploy finish; a newer push waits.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-deploy:
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
    name: typecheck + test + deploy
    runs-on: ubuntu-latest
    steps:
      # Action SHAs pinned (mirrors mcp-deploy.yml). Tag refs are mutable; SHAs are not.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml

      # --ignore-scripts: the deploy step below carries the token on this runner, so no
      # third-party lifecycle script runs next to it (mirrors mcp-deploy.yml).
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm exec tsc -p apps/status --noEmit
      - run: node --experimental-strip-types --test tests/functions/status.test.ts

      # Bundles the Worker and reads the config without credentials, so a PR fails here.
      - name: wrangler deploy (dry run)
        run: pnpm --filter @ophis/mcp-server exec wrangler deploy --dry-run --config "$GITHUB_WORKSPACE/apps/status/wrangler.jsonc"

      - name: wrangler deploy
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @ophis/mcp-server exec wrangler deploy --config "$GITHUB_WORKSPACE/apps/status/wrangler.jsonc"
