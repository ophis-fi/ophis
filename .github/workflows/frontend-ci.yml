name: frontend CI

# WHY THIS EXISTS.
#
# `apps/frontend` (the CoW Swap fork) is deliberately OUTSIDE the root pnpm
# workspace — upstream ships its own package manager and lockfile — so none of
# the repo's other PR checks build or type-check it. The only thing that ever
# compiled it was `cloudflare-deploy.yml`, which triggers on `push: main`.
#
# That combination means a type error reaches production before anyone sees it:
# the PR is green, the merge lands, and the DEPLOY fails. On 2026-07-26 exactly
# that happened. `fix(basket): wire per-leg ophisBasket marker` omitted the
# required-but-nullable `utm` field from a `buildAppData` call, and:
#
#   - the PR passed every check,
#   - the Cloudflare Pages deploy then failed with TS2345 for ~11 HOURS,
#   - SIX subsequent merges shipped nothing, because each deploy hit the same
#     pre-existing type error and aborted before publishing.
#
# It was found by accident. Nothing alerts on a red deploy — it is not a PR
# check, so it is invisible in the PR UI.
#
# This workflow closes that gap: it type-checks the frontend on PRs that touch
# it. Verified against the real defect — with the `utm` fix reverted, this job's
# command reproduces the exact error at the exact file and line:
#   useBuildBasketLegAppData.ts(46,27): error TS2345 ...
# and passes once restored.
#
# The production build also runs without deployment secrets: unset public build
# variables select their safe defaults. This deliberately exercises the real Nx,
# SWC, Vite, and plugin path before merge; Cloudflare injects production values
# later without changing that toolchain.
#
# This check runs on every PR so branch protection never waits for a
# path-filtered workflow that cannot report a result. pnpm's store is cached.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: frontend (typecheck + production build)
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs, matching cloudflare-deploy.yml (audit
      # finding M3, 2026-05-09): tag refs are mutable, SHAs are not.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
        with:
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            apps/frontend/pnpm-lock.yaml

      # Mirrors cloudflare-deploy.yml's install step. Lifecycle scripts are NOT
      # disabled here for the same reason as the deploy: the cowswap tree needs
      # them (patch-package, native deps like @swc/core and esbuild linking
      # their platform binaries). Keeping the two installs identical is the
      # point — a gate that installs differently from the deploy can pass while
      # the deploy fails.
      - name: install cowswap deps
        working-directory: apps/frontend
        run: pnpm install --frozen-lockfile

      # `nx run cowswap-frontend:typecheck`. No secrets required.
      - name: typecheck cowswap-frontend
        working-directory: apps/frontend
        run: pnpm typecheck

      # The frontend jest suite is not a repo-root CI gate (security.yml
      # documents this), and tsconfig.app.json excludes *.test.ts — so without
      # these steps the OTC exit-gate tests (read boundary, exact Milestone C
      # selector allowlist, write-sink policy, fail-closed reader/preflight,
      # reconciliation binding) would
      # NEVER execute anywhere. Scoped to the OTC suites + token policy to
      # keep the gate fast and deterministic. --passWithNoTests=false makes a
      # zero-match path filter FAIL instead of silently running no tests
      # (jest.config's passWithNoTests: true would otherwise turn a renamed
      # directory into a permanently green no-op gate).
      - name: OTC guard tests (jest, scoped)
        working-directory: apps/frontend
        run: pnpm exec nx run cowswap-frontend:test --testPathPatterns 'src/(ophis/otc|pages/Otc)' --passWithNoTests=false

      # The partner-fee guard (src/ophis/partnerFee*) proves the sdk-trading patch is
      # actually applied to the install this build uses. Unpatched, `mergeAppDataDoc`
      # CONCATENATES our CIP-75 fee pair every time a trade flow hands the SDK the same
      # appData doc back as an override, and the protocol charges every duplicate.
      # Nothing else would run these: the frontend jest suite is not a repo-root gate,
      # and a dropped patch is otherwise silent until it shows up in settlement fees.
      - name: partner-fee appData guard tests (jest, scoped)
        working-directory: apps/frontend
        run: pnpm exec nx run cowswap-frontend:test --testPathPatterns 'src/ophis/partnerFee' --passWithNoTests=false

      # ...and type-check that guard. `pnpm typecheck` above runs tsconfig.app.json,
      # which EXCLUDES *.test.ts, and the Nx jest target transforms tests with
      # babel-jest, which strips TypeScript without checking it. So the guard's
      # SDK-derived annotations (Parameters<typeof mergeAppDataDoc>) - the whole point
      # of not using `any` there - were compiled by nothing, and an SDK signature change
      # or an invalid fixture would have sailed through. Scoped to the guard file
      # because the full spec project carries ~290 pre-existing errors (missing vite
      # asset typings), so a project-wide spec typecheck could never gate anything.
      # Verified by mutation: a string `slippageBips` and a string `volumeBps` each
      # make this step exit 2.
      - name: partner-fee appData guard typecheck (tsc, scoped)
        working-directory: apps/frontend
        run: pnpm exec tsc -p apps/cowswap-frontend/tsconfig.guard.json

      - name: token policy tests (jest, scoped)
        working-directory: apps/frontend
        run: pnpm exec nx run tokens:test --testPathPatterns tokenPolicy --passWithNoTests=false

      # Coinbase tokenized stocks on Base: the shipped token list is validated
      # here with the SAME ajv schema the runtime loader applies (a schema miss
      # fails silently in production: the list never loads), plus the Base
      # list-config guard and the trusted provider-tag test. Without these
      # steps none of those suites would run anywhere in CI.
      - name: Coinbase tokenized-stocks listing tests (jest, scoped)
        working-directory: apps/frontend
        run: pnpm exec nx run cowswap-frontend:test --testPathPatterns 'src/(ophis/components/CoinbaseStockContext|modules/tokensList/hooks/useConfiguredTokenListDisplayMetadata)' --passWithNoTests=false

      - name: Base default token-list config tests (jest, scoped)
        working-directory: apps/frontend
        run: pnpm exec nx run tokens:test --testPathPatterns 'const/tokensLists' --passWithNoTests=false

      - name: production-build cowswap-frontend
        working-directory: apps/frontend
        run: pnpm build:cowswap
