name: Encrypt remaining control-plane credentials
on:
  push:
    branches: [fix/security-audit-2026-10-11]
    paths: [.github/workflows/secure-environment-migration.yml]
permissions:
  contents: read
jobs:
  encrypt:
    if: github.repository == 'ophis-fi/ophis' && github.ref == 'refs/heads/fix/security-audit-2026-10-11'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare the standard sealed-box library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsodium23
      - name: Encrypt only to this repository's environment public keys
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          ALEPH_REBATES_SSH_HOST: ${{ secrets.ALEPH_REBATES_SSH_HOST }}
          ALEPH_REBATES_SSH_KEY: ${{ secrets.ALEPH_REBATES_SSH_KEY }}
          ALEPH_REBATES_SSH_PORT: ${{ secrets.ALEPH_REBATES_SSH_PORT }}
          ALEPH_REBATES_SSH_USER: ${{ secrets.ALEPH_REBATES_SSH_USER }}
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PLMVWWDPRXYWAWFA6QZSPZDIRYCUA42QQX6J: ${{ secrets.NPM_PLMVWWDPRXYWAWFA6QZSPZDIRYCUA42QQX6J }}
        run: |
          python3 - <<'PYTHON'
          import base64, ctypes, ctypes.util, json, os
          from pathlib import Path
          keys = {'Production': {'key_id': '3380204578043523366', 'key': '/BERqcI0Y2Elq7Q2eKwGWRcswt4KEmAfKwirJxOPlzY='}, 'MCP Registry': {'key_id': '3380204578043523366', 'key': 'yWLTxcGC9q0SFDcc7wLiIWo5P03Uqtq9TPiXt+qZ0yY='}, 'Package Release': {'key_id': '3380204578043523366', 'key': '2/+BsZWfe5K4QVbrvhgowMZXWM2G9llH+sbMDqhFWwM='}}
          groups = {'Production': ['TS_AUTHKEY', 'ALEPH_REBATES_SSH_HOST', 'ALEPH_REBATES_SSH_KEY', 'ALEPH_REBATES_SSH_PORT', 'ALEPH_REBATES_SSH_USER'], 'MCP Registry': ['MCP_PRIVATE_KEY'], 'Package Release': ['NPM_TOKEN', 'NPM_PLMVWWDPRXYWAWFA6QZSPZDIRYCUA42QQX6J']}
          sodium = ctypes.CDLL(ctypes.util.find_library('sodium'))
          assert sodium.sodium_init() >= 0
          sodium.crypto_box_seal.argtypes = [ctypes.c_void_p, ctypes.c_void_p, ctypes.c_ulonglong, ctypes.c_void_p]
          sodium.crypto_box_seal.restype = ctypes.c_int
          encrypted = []
          for environment, names in groups.items():
              key = keys[environment]
              for name in names:
                  value = os.environ.pop(name).encode()
                  assert value, 'Required control-plane credential is absent'
                  public_key = base64.b64decode(key['key'])
                  assert len(public_key) == 32
                  output = ctypes.create_string_buffer(len(value) + 48)
                  assert sodium.crypto_box_seal(output, value, len(value), public_key) == 0
                  encrypted.append({'environment': environment, 'name': name, 'key_id': key['key_id'], 'encrypted_value': base64.b64encode(output.raw).decode()})
          Path('/tmp/environment-secrets-encrypted.json').write_text(json.dumps(encrypted))
          print('Encrypted', len(encrypted), 'credential copies; no plaintext written or logged')
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: control-plane-secrets-encrypted
          path: /tmp/environment-secrets-encrypted.json
          retention-days: 1
