name: backend CI

# The backend (apps/backend) is a large Rust workspace (a CoW Protocol fork), so
# compiling it is expensive. This workflow is PATH-SCOPED (like
# rebate-indexer-ci.yml): it only runs when the Rust backend OR the frontend
# OP-stablecoin source the drift test reads actually changes. Most PRs
# (frontend, docs, infra) skip it entirely, so the cold compile is only paid
# when it is relevant.
#
# REQUIRED-CHECK NOTE: because this is path-filtered, do NOT mark it a REQUIRED
# status check in branch protection unless GitHub's "skipped -> success"
# handling is on, or PRs that do not touch the backend would stall on a
# never-running check (the same property rebate-indexer-ci.yml has).
#
# COST / FUTURE PERF: there is no Rust build cache yet (consistent with the
# repo's other cargo jobs in security.yml). A backend PR cold-compiles the
# workspace dependency graph (~10-20 min). The 2026-07-26 widening (whole-
# workspace --all-targets check + 5 more test crates) adds to that: --all-targets
# also builds test/bench targets, notably the e2e crate. That cost is the point
# -- it is what catches a struct change that breaks a crate nobody tests. If it
# becomes a bottleneck, add `Swatinem/rust-cache@<pinned-sha>`
# (workspaces: apps/backend) after checkout: a pure perf win, no correctness
# change. Do NOT claw back coverage before adding the cache.

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "infra/shared/scripts/*backend-revision.py"
      - "infra/*-mainnet/configs/driver.toml.tmpl"
      - "infra/*-mainnet/compose-up.sh"
      # The OPTIMISM_STABLECOINS drift test reads this frontend file, so a
      # frontend-only stablecoin edit must still trigger the backend test.
      - "apps/frontend/libs/common-const/src/tokens.ts"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "infra/shared/scripts/*backend-revision.py"
      - "infra/*-mainnet/configs/driver.toml.tmpl"
      - "infra/*-mainnet/compose-up.sh"
      - "apps/frontend/libs/common-const/src/tokens.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor-tests:
    name: backend (cargo check all-targets + test, Ophis-diverged crates)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Keep the full workspace + test links within a hosted runner's disk budget.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      # The e2e harness creates a readonly role with this same local-test password.
      PGPASSWORD: password
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    # The OP partner-fee floor's RUNTIME enforcement lives in the Rust backend:
    # the ingress floor (shared::order_validation::enforce_partner_fee_floor),
    # the autopilot Volume clamp / Surplus-PI neutralization + the
    # ProtocolFees::new startup assert (autopilot::domain::fee), the floor math +
    # validate_partner_fees Volume-only rule + the OPTIMISM_STABLECOINS drift
    # test (app-data), and the PartnerFeeBelowFloor to HTTP 400 mapping
    # (orderbook). None of these ran in CI before (only cargo audit/deny + the
    # grep-based floor-invariant gate covered the cross-workspace INPUTS). This
    # job compiles and runs the LIB unit tests for exactly those crates so a
    # floor-LOGIC regression fails a PR. Scoped to --lib of these 4 crates on
    # purpose. The wrapper security regressions below explicitly opt into local
    # ignored integration/e2e tests with Anvil and a disposable database. The stable
    # toolchain comes from apps/backend/rust-toolchain (rustup auto-installs).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Anvil for isolated settlement regressions
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.5.1
          cache: true
      - name: Prepare disposable e2e database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          # The harness's readonly URL uses $USER as its database name. Set the
          # standard PGDATABASE for write connections to that same fresh DB.
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres "$USER"
          echo "PGDATABASE=$USER" >> "$GITHUB_ENV"
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/apps/backend/database/sql:/flyway/sql:ro" \
            -v "$GITHUB_WORKSPACE/apps/backend/database/conf:/flyway/conf:ro" \
            flyway/flyway:10.7.1 \
            -url="jdbc:postgresql://127.0.0.1:5432/$USER" \
            -user=postgres -password=password migrate
      - name: cargo fetch (retry on transient registry blips)
        working-directory: apps/backend
        # Mirror the cargo-audit/deny resilience (security.yml): a dropped
        # crates.io connection during dependency fetch must not red a PR on a
        # network blip. Fetch with the lockfile, then test --offline so the build
        # itself needs no network.
        run: |
          for attempt in 1 2 3; do
            if cargo fetch --locked; then exit 0; fi
            echo "::warning::cargo fetch failed (attempt ${attempt}/3); retrying after backoff"
            sleep $((attempt * 15))
          done
          echo "::error::cargo fetch failed after 3 attempts"
          exit 1
      # COMPILE GATE for the WHOLE workspace, including test-only targets.
      #
      # Why this exists: the cargo test step below builds only the crates it
      # names, so a change that breaks a crate nobody tests compiles fine in CI
      # and is discovered by hand later. That is exactly what happened with #924
      # (pathviz Wave 2): it added three fields to OrderQuoteRequest without
      # updating the struct literal in crates/e2e/tests/e2e/ethflow.rs, and
      # `cargo check --all-targets` stayed red on main for days because nothing
      # in CI ran it. --all-targets is load-bearing here: most e2e tests remain
      # #[ignore]d; all must still COMPILE, including those not selected below.
      - name: cargo check (whole workspace, all targets - incl. tests/benches)
        working-directory: apps/backend
        run: cargo check --offline --locked --workspace --all-targets

      # Unit tests. The first four crates are the OP partner-fee floor set this
      # job was created for. The rest were added 2026-07-26 after the Robinhood
      # (4663) wiring landed in crates the job did not cover -- chain, solvers,
      # driver, liquidity-sources and price-estimation all gained chain-specific
      # logic, and a `cargo test -p solvers` failure had gone unnoticed on main
      # for the same reason. These five are where Ophis diverges most from
      # upstream (chain enums, solver lanes, router allowlists, native pricing),
      # so they are the ones worth gating on.
      #
      # Includes app-data's unsupported-wrapper cases and driver's production
      # inline signing-policy serde/unit tests. Ignored full-path cases run below.
      - name: cargo test (Ophis-diverged crates, lib unit tests)
        working-directory: apps/backend
        run: |
          cargo test --offline --locked --lib \
            -p app-data -p shared -p autopilot -p orderbook \
            -p chain -p solvers -p driver -p liquidity-sources -p price-estimation \
            -p balance-overrides -p event-indexing -p configs -p rate-limit

      - name: Reject solver wrappers and historical wrapper orders through the driver
        working-directory: apps/backend
        run: |
          cargo test --offline --locked -p driver --lib tests::cases::wrappers:: \
            -- --ignored --test-threads=1

      - name: Public wrapper rejection and ordinary full-stack settlement
        working-directory: apps/backend
        run: |
          cargo test --offline --locked -p e2e --test e2e \
            wrapper::local_node_unsupported_wrappers -- --ignored --exact --test-threads=1

      - name: Provisioned partner fees settle while public registration stays closed
        working-directory: apps/backend
        run: |
          cargo test --offline --locked -p e2e --test e2e \
            partner_fee_registry::local_node_provisioned_registry -- --ignored --exact --test-threads=1

      # Lightweight Rust STATIC analysis on exactly the Ophis-diverged money-path
      # crates. CodeQL does not cover Rust here (codeql-config paths-ignore
      # excludes apps/backend), and cargo-audit/deny are dependency-advisory
      # scans, not SAST -- so without this, the floor/fee code that backend-ci
      # tests gets no static lint. Scoped --lib to the same 4 crates as the test
      # step; -D warnings makes a new clippy lint fail the PR.
      #
      # `rustup component add clippy` is a static.rust-lang.org fetch, separate
      # from the flaky crates.io registry the cargo-fetch retry above guards, so
      # it needs no retry wrapper. NOTE: apps/backend is a cowprotocol/services
      # fork with pre-existing style-lint debt in shared crates (e.g. an
      # explicit_auto_deref in poison-recovery), so a blanket -D warnings would
      # fail every backend PR on inherited debt. We therefore DENY only the
      # `correctness` group (real bugs block the PR) and WARN the rest (visible
      # in the log, not fatal). Tighten toward -D warnings once the upstream
      # style debt is triaged.
      - name: cargo clippy (floor-enforcement crates, deny correctness lints)
        working-directory: apps/backend
        run: |
          rustup component add clippy
          cargo clippy --offline --locked --lib -p app-data -p shared -p autopilot -p orderbook -- -W clippy::all -D clippy::correctness
