name: Deploy business console (pro.ophis.fi)

# Typecheck + unit tests on PRs; the same, then `wrangler deploy --env production`, on push to main.
#
# Uses CLOUDFLARE_WORKERS_TOKEN (Workers Scripts: Edit + Workers Routes: Edit, as mcp-deploy.yml). It cannot touch D1:
# a PR that adds a migration is applied by hand BEFORE its merge, from the app folder:
#   npx wrangler d1 migrations apply ophis-business --remote --env production
# ponytail: hand-applied migrations; give the token D1: Edit and apply them here if they become frequent.
# The custom domains (pro, sign, operator.ophis.fi) were created by the first deploy (2026-11-17); this run re-asserts them.
# Secrets are never set here: `wrangler secret put --env production` (README).

on:
  schedule:
    - cron: '31 3 * * *' # Refresh the public name lists daily.
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'apps/business-console/**'
      - 'patches/picomatch@*.patch'
      - 'scripts/test-picomatch-security.cjs'
      - '.github/workflows/business-console-deploy.yml'
  pull_request:
    paths:
      - 'apps/business-console/**'
      - 'patches/picomatch@*.patch'
      - 'scripts/test-picomatch-security.cjs'
      - '.github/workflows/business-console-deploy.yml'

permissions:
  contents: read

concurrency:
  group: business-console-deploy-${{ github.ref }}
  # Let an in-flight production deploy finish; a newer push waits.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-deploy:
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
    name: typecheck + test + deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/business-console
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/business-console/pnpm-lock.yaml

      # The app has its own lockfile (--ignore-workspace). --ignore-scripts: the deploy step below carries the token.
      - run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
      - run: node ../../scripts/test-picomatch-security.cjs .

      - run: pnpm typecheck
      # Builds dist/ (console + signing page), then the unit tests.
      - run: pnpm test

      - name: Build the index from official sanctions lists
        if: github.ref == 'refs/heads/main'
        run: node scripts/build-name-index.mjs

      - name: wrangler deploy
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # The lockfile-pinned wrangler, never a floating npx tag next to the token.
        run: pnpm exec wrangler deploy --env production
