name: Deploy @ophis/compat-api to Cloudflare Workers

# Build + typecheck + unit-test on PRs; build + deploy to Cloudflare Workers on
# push to main. Mirrors mcp-deploy.yml.
#
# Deploy uses CLOUDFLARE_WORKERS_TOKEN, the least-privilege account-scoped token
# with only "Workers Scripts: Edit" + "Workers Routes: Edit" (shared with the
# MCP deploy). The compat.ophis.fi custom domain is provisioned by wrangler on
# first deploy (the ophis.fi zone lives in this CF account), same mechanism as
# mcp.ophis.fi. The COMPAT_PATHID_KEY secret is an owner-run one-time step
# (`wrangler secret put COMPAT_PATHID_KEY` in apps/compat-api); see the deploy
# runbook in the introducing PR.

on:
  push:
    branches: [main]
    paths:
      - 'apps/compat-api/**'
      - 'packages/sdk/**'
      - '.github/workflows/compat-api-deploy.yml'
  pull_request:
    paths:
      - 'apps/compat-api/**'
      - 'packages/sdk/**'

permissions:
  contents: read

concurrency:
  group: compat-api-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    name: build + test + deploy
    runs-on: ubuntu-latest
    steps:
      # Action SHAs pinned (mirrors ci.yml). Tag refs are mutable; SHAs are not.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml

      # --ignore-scripts: this job later runs `wrangler deploy` with the
      # CLOUDFLARE_WORKERS_TOKEN on the same runner, so no third-party dependency
      # lifecycle script should execute next to that token (mirrors
      # mcp-deploy.yml / sdk-release.yml).
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The compat Worker imports @ophis/sdk from its built dist/.
      - run: pnpm --filter @ophis/sdk build

      - run: pnpm --filter @ophis/compat-api typecheck
      - run: pnpm --filter @ophis/compat-api test

      - name: wrangler deploy
        if: github.ref == 'refs/heads/main'
        working-directory: apps/compat-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Run the lockfile-pinned local wrangler instead of a floating npx tag:
        # this step carries the deploy token, so it must not fetch a compromised
        # future release; dependabot tracks the pin via package.json.
        run: pnpm exec wrangler deploy
