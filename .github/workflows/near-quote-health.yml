name: NEAR Starknet quote health

on:
  workflow_dispatch:
  schedule:
    - cron: '23,53 * * * *'
  pull_request:
    paths:
      - 'scripts/check-near-quotes*'
      - '.github/workflows/near-quote-health.yml'

permissions:
  contents: read

concurrency:
  group: near-quote-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: node --test scripts/check-near-quotes.test.mjs
      - name: Check both directions without creating deposits
        if: github.event_name != 'pull_request'
        env:
          REACT_APP_NEAR_API_KEY: ${{ secrets.REACT_APP_NEAR_API_KEY }}
        run: node scripts/check-near-quotes.mjs
