name: OTC runtime control

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'init: deploy disabled; off: stop signing; on: timed trial; public: enable until stopped'
        type: choice
        options: ['off', 'init', 'on', 'public']
        default: 'off'
        required: true
      expires_at:
        description: 'on only: UTC expiry YYYY-MM-DDTHH:MM:SSZ, within 24 hours'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: otc-runtime-control
  cancel-in-progress: false

jobs:
  control:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Prepare pinned deployment tool without credentials
        run: npx --yes --ignore-scripts wrangler@4.100.0 --version
      - name: Apply runtime control
        env:
          OTC_CONTROL_MODE: ${{ inputs.mode }}
          OTC_ENABLED_UNTIL: ${{ inputs.expires_at }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OTC_CONTROL_TOKEN: ${{ secrets.OTC_CONTROL_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKERS_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
        run: node scripts/otc-runtime-control.mjs "$OTC_CONTROL_MODE"
