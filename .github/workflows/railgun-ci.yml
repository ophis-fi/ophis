name: Railgun CI

on:
  pull_request:
    paths:
      - 'apps/railgun/**'
      - 'apps/frontend/apps/cowswap-frontend/public/logos/**'
      - 'packages/sdk/src/partner-fee.ts'
      - 'patches/elliptic@6.6.1.patch'
      - 'patches/zod@3.22.4.patch'
      - 'patches/zod@3.25.76.patch'
      - 'scripts/test-zod3-security.cjs'
      - '.github/workflows/railgun-ci.yml'
      - '.github/workflows/railgun-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'apps/railgun/**'
      - 'apps/frontend/apps/cowswap-frontend/public/logos/**'
      - 'packages/sdk/src/partner-fee.ts'
      - 'patches/elliptic@6.6.1.patch'
      - 'patches/zod@3.22.4.patch'
      - 'patches/zod@3.25.76.patch'
      - 'scripts/test-zod3-security.cjs'
      - '.github/workflows/railgun-ci.yml'
      - '.github/workflows/railgun-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railgun-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Railgun (tests + production build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/railgun
    env:
      RAILGUN_RPC_URL: http://127.0.0.1:8549
      VITE_RAILGUN_ENVIRONMENT: fork
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/railgun/package.json
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:layout
      - run: pnpm build
