name: Railgun CI

on:
  pull_request:
    paths:
      - 'apps/railgun/**'
      - 'packages/sdk/src/partner-fee.ts'
      - 'patches/elliptic@6.6.1.patch'
      - '.github/workflows/railgun-ci.yml'
      - '.github/workflows/railgun-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'apps/railgun/**'
      - 'packages/sdk/src/partner-fee.ts'
      - 'patches/elliptic@6.6.1.patch'
      - '.github/workflows/railgun-ci.yml'
      - '.github/workflows/railgun-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railgun-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Railgun (tests + production build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/railgun
    env:
      RAILGUN_RPC_URL: http://127.0.0.1:8549
      VITE_RAILGUN_ENVIRONMENT: fork
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
        with:
          package_json_file: apps/railgun/package.json
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm build
