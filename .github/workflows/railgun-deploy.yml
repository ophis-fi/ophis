name: Deploy private swap RPC

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railgun-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/railgun
    env:
      RAILGUN_RPC_URL: https://railgun-rpc.ophis.fi/rpc
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
        with:
          package_json_file: apps/railgun/package.json
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
      - run: pnpm test
        env:
          VITE_RAILGUN_ENVIRONMENT: fork
      - run: pnpm typecheck
      - name: Verify all selected upstreams before changing production
        env:
          RAILGUN_RPC_TOKEN: ${{ secrets.RAILGUN_RPC_TOKEN }}
          RAILGUN_ZAN_API_KEY: ${{ secrets.RAILGUN_ZAN_API_KEY }}
        run: |
          test -n "$RAILGUN_RPC_TOKEN"
          test -n "$RAILGUN_ZAN_API_KEY"
          node tests/rpc-readiness.mjs
      - name: Deploy restricted same-origin RPC gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAILGUN_RPC_TOKEN: ${{ secrets.RAILGUN_RPC_TOKEN }}
          RAILGUN_ZAN_API_KEY: ${{ secrets.RAILGUN_ZAN_API_KEY }}
        run: |
          pnpm exec wrangler deploy --config wrangler.rpc.jsonc
          printf '%s' "$RAILGUN_RPC_TOKEN" | pnpm exec wrangler secret put RAILGUN_RPC_TOKEN --config wrangler.rpc.jsonc
          printf '%s' "$RAILGUN_ZAN_API_KEY" | pnpm exec wrangler secret put RAILGUN_ZAN_API_KEY --config wrangler.rpc.jsonc
          pnpm exec wrangler deploy --config wrangler.rpc.jsonc --var RAILGUN_RPC_ENABLED:true
      - name: Verify all four deployed networks
        env:
          RAILGUN_READINESS_GATEWAY: https://swap.ophis.fi
        run: node tests/rpc-readiness.mjs
