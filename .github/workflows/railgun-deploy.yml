name: Deploy private swap RPC

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railgun-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/railgun
    env:
      RAILGUN_RPC_URL: https://railgun-rpc.ophis.fi/rpc
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
        with:
          package_json_file: apps/railgun/package.json
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
      - run: pnpm test
        env:
          VITE_RAILGUN_ENVIRONMENT: fork
      - run: pnpm typecheck
      - name: Verify all selected upstreams before changing production
        env:
          RAILGUN_RPC_TOKEN: ${{ secrets.RAILGUN_RPC_TOKEN }}
          RAILGUN_ZAN_API_KEY: ${{ secrets.RAILGUN_ZAN_API_KEY }}
          RAILGUN_ARBITRUM_RPC_URL: ${{ secrets.RAILGUN_ARBITRUM_RPC_URL }}
          RAILGUN_POLYGON_RPC_URL: ${{ secrets.RAILGUN_POLYGON_RPC_URL }}
          RAILGUN_BNB_RPC_URL: ${{ secrets.RAILGUN_BNB_RPC_URL }}
          RAILGUN_ARBITRUM_VALIDATION_CLOUD_URL: ${{ secrets.RAILGUN_ARBITRUM_VALIDATION_CLOUD_URL }}
          RAILGUN_POLYGON_VALIDATION_CLOUD_URL: ${{ secrets.RAILGUN_POLYGON_VALIDATION_CLOUD_URL }}
          RAILGUN_BNB_VALIDATION_CLOUD_URL: ${{ secrets.RAILGUN_BNB_VALIDATION_CLOUD_URL }}
        run: |
          test -n "$RAILGUN_RPC_TOKEN"
          test -n "$RAILGUN_ARBITRUM_RPC_URL"
          test -n "$RAILGUN_POLYGON_RPC_URL"
          test -n "$RAILGUN_BNB_RPC_URL"
          node --input-type=module -e 'for (const name of ["RAILGUN_ARBITRUM_RPC_URL", "RAILGUN_POLYGON_RPC_URL", "RAILGUN_BNB_RPC_URL", "RAILGUN_ARBITRUM_VALIDATION_CLOUD_URL", "RAILGUN_POLYGON_VALIDATION_CLOUD_URL", "RAILGUN_BNB_VALIDATION_CLOUD_URL"]) if (process.env[name]) console.log("::add-mask::" + new URL(process.env[name]).pathname.split("/").at(-1))'
          node tests/rpc-readiness.mjs
      - name: Deploy restricted same-origin RPC gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAILGUN_RPC_TOKEN: ${{ secrets.RAILGUN_RPC_TOKEN }}
          RAILGUN_ZAN_API_KEY: ${{ secrets.RAILGUN_ZAN_API_KEY }}
          RAILGUN_ARBITRUM_RPC_URL: ${{ secrets.RAILGUN_ARBITRUM_RPC_URL }}
          RAILGUN_POLYGON_RPC_URL: ${{ secrets.RAILGUN_POLYGON_RPC_URL }}
          RAILGUN_BNB_RPC_URL: ${{ secrets.RAILGUN_BNB_RPC_URL }}
          RAILGUN_ARBITRUM_VALIDATION_CLOUD_URL: ${{ secrets.RAILGUN_ARBITRUM_VALIDATION_CLOUD_URL }}
          RAILGUN_POLYGON_VALIDATION_CLOUD_URL: ${{ secrets.RAILGUN_POLYGON_VALIDATION_CLOUD_URL }}
          RAILGUN_BNB_VALIDATION_CLOUD_URL: ${{ secrets.RAILGUN_BNB_VALIDATION_CLOUD_URL }}
        run: |
          pnpm exec wrangler deploy --config wrangler.rpc.jsonc --var RAILGUN_RPC_ENABLED:true
          RAILGUN_READINESS_GATEWAY=https://swap.ophis.fi RAILGUN_READINESS_BUDGET_ONLY=1 node tests/rpc-readiness.mjs
          node --input-type=module -e 'process.stdout.write(JSON.stringify(Object.fromEntries(["RAILGUN_RPC_TOKEN", "RAILGUN_ZAN_API_KEY", "RAILGUN_ARBITRUM_RPC_URL", "RAILGUN_POLYGON_RPC_URL", "RAILGUN_BNB_RPC_URL", "RAILGUN_ARBITRUM_VALIDATION_CLOUD_URL", "RAILGUN_POLYGON_VALIDATION_CLOUD_URL", "RAILGUN_BNB_VALIDATION_CLOUD_URL"].map(key => [key, process.env[key]]).filter(([,value]) => value))))' | pnpm exec wrangler secret bulk --config wrangler.rpc.jsonc
      - name: Verify all four deployed networks
        env:
          RAILGUN_READINESS_GATEWAY: https://swap.ophis.fi
          RAILGUN_RPC_TOKEN: ${{ secrets.RAILGUN_RPC_TOKEN }}
        run: |
          RAILGUN_READINESS_BUDGET_ONLY=1 node tests/rpc-readiness.mjs
          node tests/rpc-readiness.mjs
