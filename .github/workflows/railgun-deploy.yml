name: Deploy Railgun private wallet

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railgun-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/railgun
    env:
      RAILGUN_RPC_URL: https://railgun-rpc.ophis.fi/rpc
      VITE_RAILGUN_ENVIRONMENT: ethereum
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
        with:
          package_json_file: apps/railgun/package.json
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
      - run: pnpm test
        env:
          VITE_RAILGUN_ENVIRONMENT: fork
      - run: pnpm build
      - name: Deploy authenticated wallet gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAILGUN_RPC_TOKEN: ${{ secrets.RAILGUN_RPC_TOKEN }}
        run: |
          test -n "$RAILGUN_RPC_TOKEN"
          pnpm exec wrangler deploy --var RAILGUN_RPC_URL:https://railgun-rpc.ophis.fi/rpc --var RAILGUN_RPC_ENABLED:true
          printf '%s' "$RAILGUN_RPC_TOKEN" | pnpm exec wrangler secret put RAILGUN_RPC_TOKEN
      - name: Verify deployed RPC and deny administrative methods
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          const url = 'https://private.ophis.fi'
          const headers = { 'User-Agent': 'Ophis-Private-Wallet/1.0' }
          const page = await fetch(url, { headers })
          assert.equal(page.status, 200)
          assert.match(page.headers.get('content-security-policy') || '', /frame-ancestors 'none'/)
          for (const [method, status] of [['eth_chainId', 200], ['admin_nodeInfo', 400]]) {
            const response = await fetch(`${url}/rpc`, {
              method: 'POST',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params: [] }),
            })
            assert.equal(response.status, status)
            if (status === 200) assert.equal((await response.json()).result, '0x1')
          }
          JS
