name: Rebate public-data freshness

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: rebate-public-data-freshness
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a fresh published snapshot
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 --retry 2 \
            https://rebates.ophis.fi/health > health.json
          curl --fail --silent --show-error --max-time 20 --retry 2 \
            -H 'accept: application/json' https://rebates.ophis.fi/stats > stats.json
          curl --fail --silent --show-error --max-time 20 --retry 2 \
            'https://rebates.ophis.fi/leaderboard?limit=1' > leaderboard.json
          jq . health.json
          jq -e '
            .ok == true and
            .data_fresh == true and
            .data_status == "fresh" and
            (.data_as_of | type == "string") and
            .failed_batches == 0
          ' health.json >/dev/null
          # last_pipeline_run_at is the MUTATION-PROOF half of this monitor.
          # data_fresh alone can be forged by the startup backfill that runs on every
          # container recreate: from 2026-08-28 to 08-31 the nightly pipeline never ran
          # ONCE (node-cron skipped every 02:00 on a suspending WSL2 host) while deploys
          # kept data_fresh green, so this monitor stayed silent through the entire bug.
          # Only the nightly path writes pipeline_runs (migration 0003), so asserting it
          # cannot be satisfied by a redeploy.
          PIPE_RUN="$(jq -r '.last_pipeline_run_at // empty' health.json)"
          if [ -z "$PIPE_RUN" ]; then
            echo "::error::last_pipeline_run_at is null -- the nightly pipeline has never completed. data_fresh may be masked by a deploy-time startup backfill."
            exit 1
          fi
          # Presence alone is not enough: once ANY nightly has completed, a
          # type-only check would accept that timestamp forever while nightly
          # execution silently stopped and container recreates kept data_fresh
          # green -- exactly the mask this assertion exists to remove.
          #
          # Nor is elapsed age enough. An age check SLIDES with the last run: if a
          # catch-up run lands at 01:50, the 02:00 boundary hours later can be missed
          # while the age stays under the window, letting almost TWO boundaries pass
          # unnoticed. Anchor to the BOUNDARY instead: once the grace window for the
          # latest expected 02:00 UTC run has elapsed, that run must have completed.
          #
          # This deliberately RE-IMPLEMENTS lastNightlyBoundary() from cron.ts in
          # shell rather than importing it. A checker that shares an implementation
          # with the thing it checks cannot fail on a bug in it -- two independent
          # implementations of one spec is the point.
          PIPE_TS="$(date -u -d "$PIPE_RUN" +%s)" || { echo "::error::unparseable last_pipeline_run_at: $PIPE_RUN"; exit 1; }
          NOW=$(date -u +%s)
          OFFSET=7200          # 02:00 UTC
          GRACE=7200           # 2h for the run itself to finish
          BOUNDARY=$(( ( (NOW - OFFSET) / 86400 ) * 86400 + OFFSET ))
          if [ "$NOW" -ge $(( BOUNDARY + GRACE )) ] && [ "$PIPE_TS" -lt "$BOUNDARY" ]; then
            echo "::error::nightly pipeline has not completed for the $(date -u -d "@$BOUNDARY" +%Y-%m-%dT%H:%M:%SZ) boundary (last run: $PIPE_RUN). The scheduler is not running even though public data may look fresh."
            exit 1
          fi
          echo "nightly heartbeat ok: last_pipeline_run_at=$PIPE_RUN (boundary $(date -u -d "@$BOUNDARY" +%Y-%m-%dT%H:%M:%SZ))"
          jq -e '
            .ok == true and
            .dataFresh == true and
            .dataStatus == "fresh" and
            (.dataAsOf | type == "string") and
            (.totalTrades | type == "number") and
            (.distinctTraders | type == "number") and
            (.totalVolumeUsd | type == "number")
          ' stats.json >/dev/null
          jq -e '
            .dataFresh == true and
            .dataStatus == "fresh" and
            (.dataAsOf | type == "string") and
            (.entries | type == "array")
          ' leaderboard.json >/dev/null

      - name: Alert operations
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.OPHIS_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.OPHIS_TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Telegram alerting is not configured; relying on Actions notifications"
            exit 0
          fi
          detail="health endpoint unavailable"
          if [[ -s health.json ]]; then
            detail="$(jq -c '{data_status,data_as_of,data_stale_reason,last_pipeline_run_at,failed_batches}' health.json 2>/dev/null || echo 'invalid health JSON')"
          fi
          curl --fail --silent --show-error --max-time 15 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=CRITICAL: Ophis rebate public data is stale or unhealthy. ${detail} ${RUN_URL}" >/dev/null
