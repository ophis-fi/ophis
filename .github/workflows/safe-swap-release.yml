name: Publish @ophis/safe-swap to npm

# Publishes packages/safe-swap to npm on a `safe-swap-v*` tag. The SDK release
# that the workspace dependency resolves to must already exist on npm.
on:
  push:
    tags:
      - 'safe-swap-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: build + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
        with:
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: verify tag and dependency versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PKG_VERSION="$(node -p "require('./packages/safe-swap/package.json').version")"
          TAG_VERSION="${TAG#safe-swap-v}"
          SDK_VERSION="$(node -p "require('./packages/sdk/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $TAG (version $TAG_VERSION) != safe-swap package version $PKG_VERSION" >&2
            exit 1
          fi
          if [ "$(npm view "@ophis/sdk@$SDK_VERSION" version)" != "$SDK_VERSION" ]; then
            echo "::error::@ophis/sdk@$SDK_VERSION must be published before safe-swap" >&2
            exit 1
          fi
          echo "tag matches safe-swap $PKG_VERSION; SDK $SDK_VERSION is published"

      - name: install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: build
        run: pnpm --filter @ophis/sdk build && pnpm --filter @ophis/safe-swap build

      - name: test
        run: pnpm --filter @ophis/sdk test && pnpm --filter @ophis/safe-swap test

      - name: publish
        run: pnpm --filter @ophis/safe-swap publish --no-git-checks --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
