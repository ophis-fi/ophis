# The OFAC list file of the business console (apps/business-console/README.md, "The OFAC list file"). Once a day this
# job runs the maker on OFAC's SDN.XML (downloaded from OFAC's Sanctions List Service) and commits the small file it
# writes to the branch ofac-list, which only this job writes; git keeps every version. The console reads it at
# https://raw.githubusercontent.com/ophis-fi/ophis/ofac-list/ofac.json at 03:17 UTC (wrangler.jsonc). A run that fails
# writes nothing: after 3 days the console warns the operator and its desk sends no order.
name: OFAC list file

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ofac-list
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The maker only: it uses Node's own modules, so nothing is installed.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: source
          persist-credentials: false
          sparse-checkout: apps/business-console/scripts/ofac-list.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ofac-list
          path: list
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Make the list file
        run: node source/apps/business-console/scripts/ofac-list.mjs --out list/ofac.json
      # Every day, also when the list is the same: its "made" time moves, which tells the console the job still runs.
      - name: Commit it to ofac-list
        working-directory: list
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ofac.json
          git commit -q -m "OFAC list: $(jq -r .count ofac.json) addresses, published $(jq -r .published ofac.json), made $(jq -r .made ofac.json)"
          git push -q origin HEAD:ofac-list
