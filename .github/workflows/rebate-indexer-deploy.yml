name: Ophis Robinhood consensus diagnostics (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ophis-rbh-consensus-diagnostics
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Connect to Tailscale (ephemeral CI node)
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8  # v4.1.2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci

      - name: Collect consensus metrics and upstream status on Cadia
        env:
          SSH_HOST: ${{ secrets.CADIA_REBATES_SSH_HOST }}
          SSH_USER: ${{ secrets.CADIA_REBATES_SSH_USER }}
          SSH_PORT: ${{ secrets.CADIA_REBATES_SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.CADIA_REBATES_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.CADIA_REBATES_SSH_HOST_KEY }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$SSH_HOST_KEY" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key" "$RUNNER_TEMP/ssh/known_hosts"
          ssh -i "$RUNNER_TEMP/ssh/deploy_key" -p "$SSH_PORT" \
            -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" "$SSH_USER@$SSH_HOST" \
            'bash -s' < infra/shared/scripts/incident-probe.sh
