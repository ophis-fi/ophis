name: Ophis infra diagnostics

on:
  push:
    branches: [main]
    paths:
      - "apps/rebate-indexer/**"
      - "packages/sdk/**"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/rebate-indexer-deploy.yml"
  workflow_dispatch:
    inputs:
      verify_rewards_disabled:
        description: Verify the prepared reward runtime is disabled and has issued no tickets
        required: false
        default: false
        type: boolean

concurrency:
  group: rebate-indexer-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    timeout-minutes: 8
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # Join the tailnet as an ephemeral, tagged CI node so the deploy reaches
      # Cadia's tailnet-only sshd listener instead of exposing SSH publicly.
      # Tailscale SSH itself is intentionally not used here: tag:ci is allowed
      # network access but not an interactive Tailscale SSH login.
      - name: Connect to Tailscale (ephemeral CI node)
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8  # v4.1.2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci

      - name: Diagnose Ophis Robinhood alerts (read-only)
        env:
          SSH_HOST: ${{ secrets.CADIA_REBATES_SSH_HOST }}
          SSH_USER: ${{ secrets.CADIA_REBATES_SSH_USER }}
          SSH_PORT: ${{ secrets.CADIA_REBATES_SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.CADIA_REBATES_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.CADIA_REBATES_SSH_HOST_KEY }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$SSH_HOST_KEY" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key" "$RUNNER_TEMP/ssh/known_hosts"
          ssh -i "$RUNNER_TEMP/ssh/deploy_key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" 'bash -s' < infra/shared/scripts/incident-probe.sh
